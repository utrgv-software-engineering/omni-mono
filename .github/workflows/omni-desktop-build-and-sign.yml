name: Build Signed Artifacts and Publish

on:
  workflow_dispatch:
    inputs:
      build_linux:
        description: 'Build for Linux'
        required: false
        default: true
        type: boolean
      build_macos:
        description: 'Build for macOS'
        required: false
        default: true
        type: boolean
      build_windows:
        description: 'Build for Windows'
        required: false
        default: true
        type: boolean
      release_tag:
        description: 'Tag to build, e.g. omni-desktop-v1.8.8 (defaults to the selected branch)'
        required: false
        type: string

env:
  NODE_VERSION: '22'
  # electron-builder downloads the Electron zip and its tooling (NSIS, etc.)
  # into OS-specific cache dirs (~/.electron is a legacy path it no longer
  # uses). Pin both caches inside the workspace so actions/cache captures
  # them and a GitHub CDN blip can't fail the build.
  ELECTRON_CACHE: ${{ github.workspace }}/omni-desktop/.cache/electron
  ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/omni-desktop/.cache/electron-builder

permissions:
  contents: write

defaults:
  run:
    working-directory: omni-desktop

jobs:
  build-linux:
    if: github.event.inputs.build_linux == 'true'
    runs-on: ubuntu-latest
    environment: code-signing
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.release_tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: omni-desktop/package-lock.json

      - name: Generate lockfile hash without version
        id: lockfile-hash
        run: echo "hash=$(node .github/scripts/generate-lockfile-hash.js)" >> $GITHUB_OUTPUT

      - name: Cache node modules
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: |
            omni-desktop/node_modules
            ~/.electron-gyp
            omni-desktop/.cache/electron
            omni-desktop/.cache/electron-builder
          key: ${{ runner.os }}-node-${{ env.NODE_VERSION }}-modules-v2-${{ steps.lockfile-hash.outputs.hash }}

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Get UV hash
        id: uv-hash
        run: |
          echo "hash=$(node -e "console.log(require('./package.json').uv.linux.sha256)")" >> $GITHUB_OUTPUT

      - name: Cache UV binaries
        id: cache-uv
        uses: actions/cache@v4
        with:
          path: omni-desktop/assets/bin
          key: ${{ runner.os }}-uv-${{ steps.uv-hash.outputs.hash }}

      - name: Download uv
        if: steps.cache-uv.outputs.cache-hit != 'true'
        run: npm run download linux

      - name: Build application
        run: npm run publish
        env:
          # Releases live in ericmichael/omni-desktop (the installed apps' update feed).
          GH_TOKEN: ${{ secrets.OMNI_DESKTOP_RELEASE_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: 'linux-artifacts-signed'
          path: |
            omni-desktop/dist/*.AppImage
            omni-desktop/dist/*.appimage
            omni-desktop/dist/*.blockmap
            omni-desktop/dist/*.yml
            omni-desktop/dist/*.yaml
          retention-days: 90

  build-macos:
    if: github.event.inputs.build_macos == 'true'
    runs-on: macos-latest
    environment: code-signing
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.release_tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: omni-desktop/package-lock.json

      - name: Generate lockfile hash without version
        id: lockfile-hash
        run: echo "hash=$(node .github/scripts/generate-lockfile-hash.js)" >> $GITHUB_OUTPUT

      - name: Cache node modules
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: |
            omni-desktop/node_modules
            ~/.electron-gyp
            omni-desktop/.cache/electron
            omni-desktop/.cache/electron-builder
          key: ${{ runner.os }}-node-${{ env.NODE_VERSION }}-modules-v2-${{ steps.lockfile-hash.outputs.hash }}

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Get UV hash
        id: uv-hash
        run: |
          echo "hash=$(node -e "console.log(require('./package.json').uv.mac.sha256)")" >> $GITHUB_OUTPUT

      - name: Cache UV binaries
        id: cache-uv
        uses: actions/cache@v4
        with:
          path: omni-desktop/assets/bin
          key: ${{ runner.os }}-uv-${{ steps.uv-hash.outputs.hash }}

      - name: Download uv
        if: steps.cache-uv.outputs.cache-hit != 'true'
        run: npm run download mac

      - name: Import macOS certificates
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.APPLE_CERT_FILE_B64 }}
          p12-password: ${{ secrets.APPLE_CERT_FILE_PASSWORD }}

      - name: Build and sign application
        run: npm run publish
        env:
          # Releases live in ericmichael/omni-desktop (the installed apps' update feed).
          GH_TOKEN: ${{ secrets.OMNI_DESKTOP_RELEASE_TOKEN }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: 'macos-artifacts-signed'
          path: |
            omni-desktop/dist/*.dmg
            omni-desktop/dist/*.DMG
            omni-desktop/dist/*.zip
            omni-desktop/dist/*.ZIP
            omni-desktop/dist/*.blockmap
            omni-desktop/dist/*.yml
            omni-desktop/dist/*.yaml
          retention-days: 90

  build-macos-x64:
    if: github.event.inputs.build_macos == 'true'
    runs-on: macos-15-intel
    environment: code-signing
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.release_tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: omni-desktop/package-lock.json

      - name: Generate lockfile hash without version
        id: lockfile-hash
        run: echo "hash=$(node .github/scripts/generate-lockfile-hash.js)" >> $GITHUB_OUTPUT

      - name: Cache node modules
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: |
            omni-desktop/node_modules
            ~/.electron-gyp
            omni-desktop/.cache/electron
            omni-desktop/.cache/electron-builder
          key: ${{ runner.os }}-x64-node-${{ env.NODE_VERSION }}-modules-v2-${{ steps.lockfile-hash.outputs.hash }}

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Get UV hash
        id: uv-hash
        run: |
          echo "hash=$(node -e "console.log(require('./package.json').uv['mac-x64'].sha256)")" >> $GITHUB_OUTPUT

      - name: Cache UV binaries
        id: cache-uv
        uses: actions/cache@v4
        with:
          path: omni-desktop/assets/bin
          key: ${{ runner.os }}-x64-uv-${{ steps.uv-hash.outputs.hash }}

      - name: Download uv
        if: steps.cache-uv.outputs.cache-hit != 'true'
        run: npm run download mac-x64

      - name: Import macOS certificates
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.APPLE_CERT_FILE_B64 }}
          p12-password: ${{ secrets.APPLE_CERT_FILE_PASSWORD }}

      - name: Build and sign application
        run: npm run publish
        env:
          # Releases live in ericmichael/omni-desktop (the installed apps' update feed).
          GH_TOKEN: ${{ secrets.OMNI_DESKTOP_RELEASE_TOKEN }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: 'macos-x64-artifacts-signed'
          path: |
            omni-desktop/dist/*.dmg
            omni-desktop/dist/*.DMG
            omni-desktop/dist/*.zip
            omni-desktop/dist/*.ZIP
            omni-desktop/dist/*.blockmap
            omni-desktop/dist/*.yml
            omni-desktop/dist/*.yaml
          retention-days: 90

  build-wsl-payload:
    # Linux-built payload shipped inside the Windows installer: out/server +
    # out/browser + linux-x64 node_modules for the server externals + a pinned
    # Node runtime. See docs/windows-wsl-backend-plan.md (Phase 5).
    if: github.event.inputs.build_windows == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.release_tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: omni-desktop/package-lock.json

      - name: Generate lockfile hash without version
        id: lockfile-hash
        run: echo "hash=$(node .github/scripts/generate-lockfile-hash.js)" >> $GITHUB_OUTPUT

      - name: Cache node modules
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: |
            omni-desktop/node_modules
            ~/.electron-gyp
            omni-desktop/.cache/electron
            omni-desktop/.cache/electron-builder
          key: ${{ runner.os }}-node-${{ env.NODE_VERSION }}-modules-v2-${{ steps.lockfile-hash.outputs.hash }}

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Build server + browser
        run: npm run build:server

      - name: Build WSL payload
        run: npm run build:wsl-payload

      - name: Upload payload
        uses: actions/upload-artifact@v4
        with:
          name: wsl-payload
          path: omni-desktop/out/wsl-payload/omni-wsl-payload.tar.gz
          if-no-files-found: error

  build-windows:
    if: github.event.inputs.build_windows == 'true'
    needs: build-wsl-payload
    runs-on: windows-latest
    environment: code-signing
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.release_tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: omni-desktop/package-lock.json

      - name: Generate lockfile hash without version
        id: lockfile-hash
        shell: bash
        run: echo "hash=$(node .github/scripts/generate-lockfile-hash.js)" >> $GITHUB_OUTPUT

      - name: Cache node modules
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: |
            omni-desktop/node_modules
            ~/.electron-gyp
            omni-desktop/.cache/electron
            omni-desktop/.cache/electron-builder
          key: ${{ runner.os }}-node-${{ env.NODE_VERSION }}-modules-v2-${{ steps.lockfile-hash.outputs.hash }}

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Get UV hash
        id: uv-hash
        shell: bash
        run: |
          echo "hash=$(node -e "console.log(require('./package.json').uv.win.sha256)")" >> $GITHUB_OUTPUT

      - name: Cache UV binaries
        id: cache-uv
        uses: actions/cache@v4
        with:
          path: omni-desktop/assets/bin
          key: ${{ runner.os }}-uv-${{ steps.uv-hash.outputs.hash }}

      - name: Download uv
        if: steps.cache-uv.outputs.cache-hit != 'true'
        run: npm run download win

      - name: Download WSL payload
        # Lands outside out/ because `npm run publish` starts with `npm run
        # clean` (rimraf out/); OMNI_WSL_PAYLOAD points electron-builder at it.
        uses: actions/download-artifact@v4
        with:
          name: wsl-payload
          path: omni-desktop/wsl-payload

      - name: Set tool paths for signing
        run: |
          echo "C:\Program Files (x86)\Windows Kits\10\App Certification Kit" >> $GITHUB_PATH
          echo "C:\Program Files (x86)\Microsoft SDKs\Windows\v10.0A\bin\NETFX 4.8 Tools" >> $GITHUB_PATH
          echo "C:\Program Files\DigiCert\DigiCert One Signing Manager Tools" >> $GITHUB_PATH
        shell: bash

      - name: Build and sign application
        run: npm run publish
        env:
          OMNI_WSL_PAYLOAD: wsl-payload/omni-wsl-payload.tar.gz
          ENABLE_SIGNING: true
          # Releases live in ericmichael/omni-desktop (the installed apps' update feed).
          GH_TOKEN: ${{ secrets.OMNI_DESKTOP_RELEASE_TOKEN }}
          SM_HOST: ${{ secrets.SM_HOST }}
          SM_API_KEY: ${{ secrets.SM_API_KEY }}
          SM_CLIENT_CERT_PASSWORD: ${{ secrets.SM_CLIENT_CERT_PASSWORD }}
          SM_CLIENT_CERT_FILE_B64: ${{ secrets.SM_CLIENT_CERT_FILE_B64 }}
          SM_CODE_SIGNING_CERT_SHA1_HASH: ${{ secrets.SM_CODE_SIGNING_CERT_SHA1_HASH }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: 'windows-artifacts-signed'
          path: |
            omni-desktop/dist/*.exe
            omni-desktop/dist/*.EXE
            omni-desktop/dist/*.blockmap
            omni-desktop/dist/*.yml
            omni-desktop/dist/*.yaml
          retention-days: 90
