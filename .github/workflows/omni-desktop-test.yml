name: Run Tests

on:
  push:
    branches: [main, dev]
    paths:
      - 'omni-desktop/**'
      - 'omniagents/omniagents/backends/web/ui/src/protocol/generated/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/omni-desktop-test.yml'
  pull_request:
    types: [ready_for_review, opened, synchronize]
    paths:
      - 'omni-desktop/**'
      - 'omniagents/omniagents/backends/web/ui/src/protocol/generated/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/omni-desktop-test.yml'
  workflow_dispatch:
  merge_group:

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: omni-desktop

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:no-watch
