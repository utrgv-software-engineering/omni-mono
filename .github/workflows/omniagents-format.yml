name: Format

on:
  push:
    branches: [main, dev]
    paths:
      - 'omniagents/**'
      - '.github/workflows/omniagents-format.yml'
  pull_request:
    paths:
      - 'omniagents/**'
      - '.github/workflows/omniagents-format.yml'

defaults:
  run:
    working-directory: omniagents

jobs:
  black:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        # black is version-pinned in pyproject's dev extras (and uv.lock), so
        # CI and local dev run the identical formatter — a locally-clean
        # `black --check` always means a green Format job.
        run: pip install .[dev]
      - name: Check formatting
        run: black --check . --exclude 'omniagents/core/project/templates'
