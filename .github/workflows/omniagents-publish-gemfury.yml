name: Publish to Gemfury

on:
  release:
    types: [published]
  workflow_dispatch:

defaults:
  run:
    working-directory: omniagents

jobs:
  intel-macos-wheel:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'omniagents-v')
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: python -m pip install build
      - run: make package-build
      - run: "python -m pip install --no-deps --only-binary=:all: dist/*.whl"
      - run: python -I -c "from omniagents import _quickjs; assert _quickjs.Context().eval('40+2') == 42"
      - uses: actions/upload-artifact@v4
        with:
          name: intel-macos-dist
          path: omniagents/dist/*.whl
  build-and-publish:
    needs: intel-macos-wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build
      - name: Build package (Studio + Ink assets)
        run: make package-build
      - uses: actions/download-artifact@v4
        with:
          name: intel-macos-dist
          path: omniagents/dist
      - name: Publish to Gemfury
        env:
          FURY_USER: ${{ secrets.FURY_USER }}
          FURY_TOKEN: ${{ secrets.FURY_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${FURY_USER:-}" ] || [ -z "${FURY_TOKEN:-}" ]; then
            echo "FURY_USER and FURY_TOKEN secrets must be set"
            exit 1
          fi
          for file in dist/*; do
            if [ -f "$file" ]; then
              echo "Uploading $file to Gemfury"
              curl -f -sS -F package=@"$file" "https://${FURY_TOKEN}@push.fury.io/${FURY_USER}/"
            fi
          done
          if ls dist/* >/dev/null 2>&1; then
            echo "Upload complete"
          else
            echo "No distribution files found"
            exit 1
          fi
