name: Studio Tests

# omniagents-studio tests against this repository's omniagents, so framework
# changes run it too.

on:
  push:
    branches: [main, dev]
    paths:
      - 'omniagents-studio/**'
      - 'omniagents/**'
      - '.github/workflows/omniagents-studio-tests.yml'
  pull_request:
    paths:
      - 'omniagents-studio/**'
      - 'omniagents/**'
      - '.github/workflows/omniagents-studio-tests.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: omniagents-studio

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ../omniagents -e .
          pip install --group dev
      - name: Format (black)
        run: black --check .
      - name: Python tests
        run: pytest -n auto
      - name: Install web dependencies
        working-directory: omniagents-studio/web
        run: npm ci
      - name: Lint web
        working-directory: omniagents-studio/web
        run: npm run lint
      - name: Test web
        working-directory: omniagents-studio/web
        run: npx vitest run
      - name: Build web
        working-directory: omniagents-studio/web
        run: npm run build
