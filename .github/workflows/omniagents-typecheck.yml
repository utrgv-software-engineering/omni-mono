name: Typecheck

on:
  push:
    branches: [main, dev]
    paths:
      - 'omniagents/**'
      - '.github/workflows/omniagents-typecheck.yml'
  pull_request:
    paths:
      - 'omniagents/**'
      - '.github/workflows/omniagents-typecheck.yml'

defaults:
  run:
    working-directory: omniagents

jobs:
  mypy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        # mypy is version-pinned in pyproject's dev extras (and uv.lock), so
        # CI and local dev run the identical checker — a locally-clean
        # `mypy` always means a green Typecheck job. The server extra is
        # installed so fastapi/uvicorn-dependent modules typecheck against
        # the real dependencies rather than ignore_missing_imports.
        run: pip install '.[dev,server]'
      - name: Typecheck
        # Files, excludes, and the per-module typecheck-debt override list
        # all come from [tool.mypy] in pyproject.toml.
        run: mypy
