name: Build eval image

# Builds and publishes omni-code's own eval sandbox image from
# evaluations/Dockerfile (see that file for the package rationale). The
# eval profiles (evaluations/profiles/devbox*.yml) pin the digest this
# workflow prints — after a rebuild, re-pin them from the "Print published
# digest" step output. Modeled on the launcher's publish-sandbox-image.yml.

on:
  push:
    branches: [main]
    paths:
      - "evaluations/Dockerfile"
      - "evaluations/apply-network-isolation.sh"
      - ".github/workflows/build-eval-image.yml"
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/omni-code-eval

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: evaluations
          file: evaluations/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
      - name: Print published digest
        run: |
          docker buildx imagetools inspect "${IMAGE}:latest" | head -5
