name: filesystem
# Extends the omniagents builtin `filesystem` pack with coding-flavored
# guidance. The builtin discovery tools (`list_directory`, `glob_files`,
# `grep_files`) ripgrep-accelerate themselves when `rg` is available in
# the workspace, so no tools are excluded — the instructions just steer
# habitual discovery toward the shell where piping/chaining helps.
extends: filesystem
instructions_append: |
  - Use `apply_patch` exactly; do not try similarly named commands such as
    `applypatch` or `apply-patch`.
  - After a file edit tool succeeds, do not re-read the file just to confirm
    the edit; the tool reports failure if it did not apply.
  - Prefer shell discovery — `rg <pattern>`, `rg --files`, `ls` — over the
    filesystem discovery tools when `rg` is available: it pipes and chains
    (`| head`, `| xargs`), which the tools cannot.
