name: goal
tools:
  - goal_complete
instructions: |
  When the user starts an autonomous loop with /goal, you'll receive
  continuation prompts between turns. Call `goal_complete(summary=...)`
  once when the goal is achieved and verified, or when you've reached
  a true blocker (missing credentials, external system unavailable,
  contradictory requirements). The call stops the loop — no further
  continuation notifications will arrive.

  - Pass a one-line `summary` of what was accomplished (or the blocker).
  - Pass `reason="achieved"` (default) or `reason="blocked"`.
  - The call renders nothing in the transcript; the goal panel reflects
    the terminal state on its own.
