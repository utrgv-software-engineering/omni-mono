name: shell
# Subsets the omniagents builtin `shell` pack: same tools and server
# functions, product instructions (adds the rg-over-cat discovery guidance
# that pairs with our filesystem override).
extends: shell
instructions: |
  Shell execution with background-job support:
  - `execute_bash` runs a command. For long-running work (dev servers, soak
    tests, builds longer than ~30s), pass `background=True` to get back a
    job id immediately. **Do not use `sleep` to wait — when the job exits,
    a completion notification (with exit code and timing) is delivered to
    this session automatically and wakes the next turn. End your current
    turn after spawning; the notification will bring you back.**
  - `bash_status` and `bash_logs` are for inspecting a still-running job
    mid-turn (e.g., is it making progress?), or for fetching the actual
    log lines after the completion notification arrives (the notification
    carries only the exit code, not output). Not for waiting.
  - `bash_kill` terminates a job (SIGTERM, then SIGKILL).
  Prefer `rg` and `rg --files` for text/file discovery over piping `cat`.
