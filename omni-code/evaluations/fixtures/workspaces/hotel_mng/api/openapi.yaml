openapi: 3.0.3
info:
  title: Hotel Management API for AI Agents
  version: 2.0.0
  contact:
    email: api@hotelmanagement.com
  description: |
    # Hotel Management API for AI Agents
    
    This API is designed specifically for AI agents to interact with the hotel management
    system. All endpoints require authentication via API keys tied to AI agent user accounts.
    
    ## Authentication
    
    All endpoints require an API key in the X-API-Key header. API keys are assigned to
    AI agent users with specific roles (front_desk, housekeeping, hotel_manager, etc.)
    
    ## Hotel Context
    
    Most endpoints are scoped to a specific hotel via the hotel_id parameter in the URL path.
    The API validates that the authenticated agent has access to the specified hotel.
    
    ## Rate Limiting
    
    Rate limits may be applied per API key. Check response headers for rate limit information.
    
    ## Error Responses
    
    All error responses follow a consistent format with error code, message, and details.

servers:
  - url: http://localhost:3000
    description: Development
  - url: https://api.hotelmanagement.com
    description: Production

security:
  - ApiKeyAuth: []

tags:
  - name: Hotels
    description: Hotel property information and management
  - name: Rooms
    description: Room inventory and status management
  - name: Room Types
    description: Room categories and pricing
  - name: Reservations
    description: Booking and reservation management
  - name: Availability
    description: Room availability checking
  - name: Guests
    description: Guest management and VIP status
  - name: Check-In/Out
    description: Check-in and check-out workflows
  - name: Housekeeping Tasks
    description: Housekeeping task management and assignment
  - name: Maintenance Requests
    description: Maintenance request tracking and management
  - name: Data Agent
    description: Database schema information and query preview for AI data analytics

paths:
  /api/v1/hotels:
    get:
      summary: List all hotels
      operationId: listHotels
      tags: [Hotels]
      parameters:
        - name: search
          in: query
          schema:
            type: string
          description: Search hotels by name
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Hotels retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Hotel'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      summary: Create a new hotel
      operationId: createHotel
      tags: [Hotels]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HotelInput'
      responses:
        '201':
          description: Hotel created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Hotel'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v1/hotels/{hotel_id}:
    get:
      summary: Get hotel details
      operationId: getHotel
      tags: [Hotels]
      parameters:
        - $ref: '#/components/parameters/HotelId'
        - name: include
          in: query
          required: false
          schema:
            type: string
          description: |
            Comma-separated list of related resources to include in the response.
            Supported values: amenities, policies, services, all
            Example: ?include=amenities,policies
          examples:
            single:
              value: amenities
              summary: Include only amenities
            multiple:
              value: amenities,policies,services
              summary: Include multiple resources
            all:
              value: all
              summary: Include all related resources
      responses:
        '200':
          description: Hotel details retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    anyOf:
                      - $ref: '#/components/schemas/Hotel'
                      - $ref: '#/components/schemas/HotelDetailed'
                    description: Returns Hotel when no includes specified, HotelDetailed when include parameter is used
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      summary: Update hotel details
      operationId: updateHotel
      tags: [Hotels]
      parameters:
        - $ref: '#/components/parameters/HotelId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HotelInput'
      responses:
        '200':
          description: Hotel updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Hotel'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      summary: Delete a hotel
      operationId: deleteHotel
      tags: [Hotels]
      parameters:
        - $ref: '#/components/parameters/HotelId'
      responses:
        '204':
          description: Hotel deleted successfully
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Cannot delete hotel with existing reservations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/hotels/{hotel_id}/rooms:
    get:
      summary: List hotel rooms
      operationId: listHotelRooms
      tags: [Rooms]
      parameters:
        - $ref: '#/components/parameters/HotelId'
        - name: status
          in: query
          schema:
            type: string
            enum: [available, occupied, maintenance, cleaning]
          description: Filter by room status
        - name: floor
          in: query
          schema:
            type: integer
          description: Filter by floor number
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Rooms retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Room'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
                  links:
                    $ref: '#/components/schemas/PaginationLinks'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      summary: Create a new room
      operationId: createRoom
      tags: [Rooms]
      parameters:
        - $ref: '#/components/parameters/HotelId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoomInput'
      responses:
        '201':
          description: Room created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Room'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v1/hotels/{hotel_id}/rooms/{id}:
    get:
      summary: Get room details
      operationId: getRoom
      tags: [Rooms]
      parameters:
        - $ref: '#/components/parameters/HotelId'
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Room details retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Room'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      summary: Update room
      operationId: updateRoom
      tags: [Rooms]
      parameters:
        - $ref: '#/components/parameters/HotelId'
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoomInput'
      responses:
        '200':
          description: Room updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Room'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      summary: Delete room
      operationId: deleteRoom
      tags: [Rooms]
      parameters:
        - $ref: '#/components/parameters/HotelId'
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '204':
          description: Room deleted successfully
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Cannot delete room with active reservations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/hotels/{hotel_id}/rooms/{id}/status:
    patch:
      summary: Update room status
      operationId: updateRoomStatus
      tags: [Rooms]
      parameters:
        - $ref: '#/components/parameters/HotelId'
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [available, occupied, maintenance, cleaning]
      responses:
        '200':
          description: Room status updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Room'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/hotels/{hotel_id}/room_types:
    get:
      summary: List room types
      operationId: listRoomTypes
      tags: [Room Types]
      parameters:
        - $ref: '#/components/parameters/HotelId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Room types retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/RoomType'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
                  links:
                    $ref: '#/components/schemas/PaginationLinks'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      summary: Create room type
      operationId: createRoomType
      tags: [Room Types]
      parameters:
        - $ref: '#/components/parameters/HotelId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoomTypeInput'
      responses:
        '201':
          description: Room type created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/RoomType'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v1/hotels/{hotel_id}/room_types/{id}:
    get:
      summary: Get room type details
      operationId: getRoomType
      tags: [Room Types]
      parameters:
        - $ref: '#/components/parameters/HotelId'
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Room type details retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/RoomType'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      summary: Update room type
      operationId: updateRoomType
      tags: [Room Types]
      parameters:
        - $ref: '#/components/parameters/HotelId'
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoomTypeInput'
      responses:
        '200':
          description: Room type updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/RoomType'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      summary: Delete room type
      operationId: deleteRoomType
      tags: [Room Types]
      parameters:
        - $ref: '#/components/parameters/HotelId'
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '204':
          description: Room type deleted successfully
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Cannot delete room type with existing rooms
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/hotels/{hotel_id}/availability:
    get:
      summary: Check room availability
      operationId: checkAvailability
      tags: [Availability]
      parameters:
        - $ref: '#/components/parameters/HotelId'
        - name: check_in_date
          in: query
          required: false
          schema:
            type: string
          description: Check-in date (YYYY-MM-DD)
        - name: check_out_date
          in: query
          required: false
          schema:
            type: string
          description: Check-out date (YYYY-MM-DD)
        - name: adults
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
          description: Number of adult guests
        - name: children
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
          description: Number of children
      responses:
        '200':
          description: Availability information retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/RoomTypeAvailability'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/hotels/{hotel_id}/reservations:
    get:
      summary: List hotel reservations
      operationId: listHotelReservations
      tags: [Reservations]
      parameters:
        - $ref: '#/components/parameters/HotelId'
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, confirmed, checked_in, checked_out, cancelled, no_show]
          description: Filter by reservation status
        - name: check_in_date
          in: query
          schema:
            type: string
            format: date
          description: Filter by check-in date
        - name: guest_search
          in: query
          schema:
            type: string
          description: Search by guest name or email (partial match). Useful for staff dashboards.
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Reservations retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Reservation'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
                  links:
                    $ref: '#/components/schemas/PaginationLinks'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    post:
      summary: Create reservation
      operationId: createReservation
      tags: [Reservations]
      parameters:
        - $ref: '#/components/parameters/HotelId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReservationCreateRequest'
      responses:
        '201':
          description: Reservation created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Reservation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /api/v1/reservations/lookup:
    get:
      summary: Lookup reservation by confirmation number or email
      description: |
        Secure lookup method requiring exact match. Use this instead of
        list_hotel_reservations for customer-facing lookups to protect guest privacy.
        Provide either confirmation_number OR email (not both).
      operationId: lookupReservation
      tags: [Reservations]
      parameters:
        - name: confirmation_number
          in: query
          required: false
          schema:
            type: string
          description: Reservation confirmation number (exact match)
          example: "20240120A3F"
        - name: email
          in: query
          required: false
          schema:
            type: string
            format: email
          description: Guest email address (exact match, case-insensitive). Returns all reservations for this email.
          example: "guest@example.com"
      responses:
        '200':
          description: Reservation(s) found
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    oneOf:
                      - $ref: '#/components/schemas/Reservation'
                      - type: array
                        items:
                          $ref: '#/components/schemas/Reservation'
                    description: Single reservation for confirmation_number lookup, array for email lookup
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/reservations/{id}:
    get:
      summary: Get reservation details
      operationId: getReservation
      tags: [Reservations]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Reservation ID
      responses:
        '200':
          description: Reservation details retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Reservation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      summary: Update reservation
      operationId: updateReservation
      tags: [Reservations]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Reservation ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReservationUpdateRequest'
      responses:
        '200':
          description: Reservation updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Reservation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    
    delete:
      summary: Delete reservation
      operationId: deleteReservation
      tags: [Reservations]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Reservation ID
      responses:
        '204':
          description: Reservation deleted successfully
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Only cancelled or no_show reservations can be deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/reservations/{id}/check_in:
    post:
      summary: Check in a reservation
      operationId: checkInReservation
      tags: [Check-In/Out]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Reservation ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [room_id]
              properties:
                room_id:
                  type: integer
                  description: ID of the room to assign
      responses:
        '200':
          description: Guest checked in successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Reservation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Conflict (invalid status, room unavailable, etc.)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/reservations/{id}/check_out:
    post:
      summary: Check out a reservation
      operationId: checkOutReservation
      tags: [Check-In/Out]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Reservation ID
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                payment_amount:
                  type: number
                  format: float
                  description: Payment amount received
                create_housekeeping_task:
                  type: boolean
                  description: Whether to create a housekeeping task
      responses:
        '200':
          description: Guest checked out successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Reservation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Only checked-in reservations can be checked out
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/reservations/{reservation_id}/check_in/available_rooms:
    get:
      summary: Get available rooms for check-in
      operationId: getAvailableRoomsForCheckIn
      tags: [Check-In/Out]
      parameters:
        - name: reservation_id
          in: path
          required: true
          schema:
            type: integer
          description: Reservation ID
      responses:
        '200':
          description: Available rooms retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Room'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/reservations/{reservation_id}/check_out/summary:
    get:
      summary: Get check-out summary
      operationId: getCheckOutSummary
