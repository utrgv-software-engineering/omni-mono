          properties:
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time

    HotelInput:
      type: object
      required: [name, subdomain, address, city, state, country, phone, email]
      properties:
        name:
          type: string
        subdomain:
          type: string
        address:
          type: string
        city:
          type: string
        state:
          type: string
        country:
          type: string
        postal_code:
          type: string
        phone:
          type: string
        email:
          type: string
          format: email
        website:
          type: string
        description:
          type: string
        check_in_time:
          type: string
        check_out_time:
          type: string
        timezone:
          type: string
        star_rating:
          type: number

    RoomInput:
      type: object
      required: [room_type_id, room_number, floor]
      properties:
        room_type_id:
          type: integer
        room_number:
          type: string
        floor:
          type: integer
        status:
          type: string
          enum: [available, occupied, maintenance, cleaning]
        is_smoking:
          type: boolean
        notes:
          type: string
        last_cleaned_at:
          type: string
          format: date-time
          nullable: true

    RoomTypeInput:
      type: object
      required: [name, code, base_price, standard_occupancy, max_occupancy]
      properties:
        name:
          type: string
        code:
          type: string
        description:
          type: string
        base_price:
          type: number
        standard_occupancy:
          type: integer
        max_occupancy:
          type: integer
        extra_person_charge:
          type: number
        size_sqm:
          type: number

    TableInfo:
      type: object
      required: [name, type, description, row_count]
      properties:
        name:
          type: string
          description: Table name
          example: "reservations"
        type:
          type: string
          enum: [table, view]
          description: Whether this is a table or view
        description:
          type: string
          description: Human-readable description of table purpose
          example: "Guest reservations and booking information"
        row_count:
          type: integer
          description: Approximate number of rows (for current account)
          example: 1250
        primary_key:
          type: string
          nullable: true
          description: Primary key column name
          example: "id"
        created_at:
          type: string
          format: date-time
          nullable: true
          description: When table was created
        updated_at:
          type: string
          format: date-time
          nullable: true
          description: Last data modification time

    TableSchema:
      type: object
      required: [table_name, columns, row_count]
      properties:
        table_name:
          type: string
          description: Table name
          example: "reservations"
        description:
          type: string
          description: Table description
          example: "Guest reservations and booking information"
        columns:
          type: array
          items:
            $ref: '#/components/schemas/ColumnInfo'
        relationships:
          type: array
          items:
            $ref: '#/components/schemas/TableRelationship'
        indexes:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              columns:
                type: array
                items:
                  type: string
              unique:
                type: boolean
        row_count:
          type: integer
          description: Approximate row count for current account
        sample_queries:
          type: array
          description: Example queries for this table
          items:
            type: object
            properties:
              description:
                type: string
              sql:
                type: string

    ColumnInfo:
      type: object
      required: [name, data_type, nullable]
      properties:
        name:
          type: string
          description: Column name
          example: "check_in_date"
        data_type:
          type: string
          description: SQL data type
          example: "date"
        nullable:
          type: boolean
          description: Whether column allows NULL values
        default_value:
          type: string
          nullable: true
          description: Default value if any
        is_primary_key:
          type: boolean
          default: false
        is_foreign_key:
          type: boolean
          default: false
        foreign_key_table:
          type: string
          nullable: true
          description: Referenced table if foreign key
        foreign_key_column:
          type: string
          nullable: true
          description: Referenced column if foreign key
        description:
          type: string
          nullable: true
          description: Human-readable column description
          example: "Date when guest checks in"
        enum_values:
          type: array
          nullable: true
          description: Possible values for enum columns
          items:
            type: string

    TableRelationship:
      type: object
      required: [type, related_table, local_column, foreign_column]
      properties:
        type:
          type: string
          enum: [belongs_to, has_many, has_one]
          description: Relationship type
        related_table:
          type: string
          description: Related table name
        local_column:
          type: string
          description: Column in this table
        foreign_column:
          type: string
          description: Column in related table
        relationship_name:
          type: string
          description: Rails association name
          example: "guest"

    QueryResult:
      type: object
      required: [columns, rows, row_count, execution_time_ms]
      properties:
        columns:
          type: array
          description: Column names in result set
          items:
            type: string
          example: ["status", "count"]
        rows:
          type: array
          description: Result rows
          items:
            type: array
            items: {}
          example: [["confirmed", 42], ["checked_in", 15]]
        row_count:
          type: integer
          description: Number of rows returned
          example: 2
        total_count:
          type: integer
          nullable: true
          description: Total rows if query had no LIMIT (when available)
        truncated:
          type: boolean
          description: Whether results were truncated due to max_rows limit
        execution_time_ms:
          type: number
          description: Query execution time in milliseconds
          example: 23.5
        query_plan:
          type: string
          nullable: true
          description: Query execution plan (if requested)

    QueryError:
      type: object
      required: [error, message, status]
      properties:
        error:
          type: string
          example: "Query Error"
        message:
          type: string
          description: Detailed error message
          example: "Column 'invalid_column' does not exist in table 'reservations'"
        status:
          type: integer
          example: 400
        query:
          type: string
          description: The SQL query that caused the error
        position:
          type: integer
          nullable: true
          description: Character position where error occurred
        hint:
          type: string
          nullable: true
          description: Suggestion for fixing the error

    GuestInput:
      type: object
      required: [first_name, last_name, email]
      properties:
        first_name:
          type: string
        last_name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        date_of_birth:
          type: string
          format: date
        nationality:
          type: string
        passport_number:
          type: string
        id_number:
          type: string
        address:
          type: string
        city:
          type: string
        state:
          type: string
        country:
          type: string
        postal_code:
          type: string
        vip_status:
          type: boolean
        notes:
          type: string

    # Input schemas for new endpoints
    AmenityInput:
      type: object
      required: [name, category]
      properties:
        name:
          type: string
          description: Amenity name
          example: "Swimming Pool"
        category:
          type: string
          enum: [room, hotel, bathroom, kitchen, entertainment, accessibility, business, family, outdoor, wellness]
          description: Amenity category
        icon:
          type: string
          nullable: true
          description: Icon identifier for the amenity
        description:
          type: string
          nullable: true
          description: Description of the amenity
        is_countable:
          type: boolean
          default: false

    AmenityUpdateInput:
      type: object
      properties:
        name:
          type: string
          description: Amenity name
          example: "Swimming Pool"
        category:
          type: string
          enum: [room, hotel, bathroom, kitchen, entertainment, accessibility, business, family, outdoor, wellness]
          description: Amenity category
        icon:
          type: string
          nullable: true
          description: Icon identifier for the amenity
        description:
          type: string
          nullable: true
          description: Description of the amenity
        is_countable:
          type: boolean
          description: Whether this amenity has a quantity (e.g., number of beds)

    HotelAmenityInput:
      type: object
      properties:
        amenity_id:
          type: integer
          description: Reference to master amenity
        is_available:
          type: boolean
          default: true
        is_free:
          type: boolean
          default: true
        additional_cost:
          type: string
          pattern: '^\d+(\.\d{1,2})?$'
          nullable: true
          description: Cost if not free
        location:
          type: string
          nullable: true
          description: Where the amenity is located
        operating_hours:
          type: string
          nullable: true
          description: Operating hours
        notes:
          type: string
          nullable: true

    HotelPolicyInput:
      type: object
      required: [policy_type, title]
      properties:
        policy_type:
          type: string
          enum: [check_in, check_out, cancellation, pet, smoking, children, other]
        title:
          type: string
        description:
          type: string
          nullable: true
        sort_order:
          type: integer
          default: 0
        is_active:
          type: boolean
          default: true

    RoomTypeAmenity:
      type: object
      required: [id, amenity_id]
      properties:
        id:
          type: integer
        amenity_id:
          type: integer
        quantity:
          type: integer
          nullable: true
          description: Quantity for countable amenities
        display_text:
          type: string
          description: Formatted display text
        amenity:
          $ref: '#/components/schemas/Amenity'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    RoomTypeAmenityInput:
      type: object
      required: [amenity_id]
      properties:
        amenity_id:
          type: integer
          description: Reference to master amenity
        quantity:
          type: integer
          nullable: true
          description: Quantity for countable amenities (e.g., number of beds)

    CancellationPolicy:
      type: object
      required: [id, name, code, cancellation_type, is_refundable, is_default]
      properties:
        id:
          type: integer
        name:
          type: string
          example: "Flexible Cancellation"
        code:
          type: string
          example: "FLEX"
        cancellation_type:
          type: string
          enum: [flexible, moderate, strict, non_refundable]
        description:
          type: string
          nullable: true
        is_refundable:
          type: boolean
        is_default:
          type: boolean
        free_cancellation_hours:
          type: integer
          nullable: true
          description: Hours before check-in for free cancellation
        penalty_percentage:
          type: string
          nullable: true
          pattern: '^\d+(\.\d{1,2})?$'
        penalty_nights:
          type: integer
          nullable: true
        no_show_penalty:
          type: string
          nullable: true
          pattern: '^\d+(\.\d{1,2})?$'
        hotel_id:
          type: integer
          nullable: true
          description: Hotel ID if hotel-specific, null for account-wide
        scope:
          type: string
          enum: [account_wide, hotel_specific]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CancellationPolicyInput:
      type: object
      required: [name, code, cancellation_type]
      properties:
        name:
          type: string
          description: Policy name
        code:
          type: string
          description: Short code for the policy
        cancellation_type:
          type: string
          enum: [flexible, moderate, strict, non_refundable]
        description:
          type: string
          nullable: true
        is_refundable:
          type: boolean
          default: true
        free_cancellation_hours:
          type: integer
          nullable: true
          description: Hours before check-in for free cancellation
        penalty_percentage:
          type: string
          nullable: true
          pattern: '^\d+(\.\d{1,2})?$'
        penalty_nights:
          type: integer
          nullable: true
        no_show_penalty:
          type: string
          nullable: true
          pattern: '^\d+(\.\d{1,2})?$'
        is_default:
          type: boolean
          default: false

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: "Bad Request"
            message: "Invalid request parameters"
            status: 400

    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: "Unauthorized"
            message: "Invalid or missing API key"
            status: 401

    Forbidden:
      description: Access denied
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: "Forbidden"
            message: "You do not have permission to access this resource"
            status: 403

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: "Not Found"
            message: "Resource not found"
            status: 404

    UnprocessableEntity:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: "Validation Failed"
            message: "The request could not be processed due to validation errors"
            status: 422
            errors:
              - field: "check_out_date"
                code: "invalid"
                message: "Check-out date must be after check-in date"
    
    ValidationError:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: "Validation Failed"
            message: "Validation failed for resource"
            status: 422
