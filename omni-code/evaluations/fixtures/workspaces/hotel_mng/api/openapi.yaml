    post:
      summary: Calculate cancellation fee
      description: Calculate the cancellation fee for a reservation based on a policy
      operationId: calculateCancellationFee
      tags:
        - Cancellation Policies
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [policy_id, reservation_id]
              properties:
                policy_id:
                  type: integer
                  description: Cancellation policy ID
                reservation_id:
                  type: integer
                  description: Reservation ID
                cancellation_date:
                  type: string
                  format: date
                  description: Date of cancellation (defaults to today)
      responses:
        '200':
          description: Cancellation fee calculation
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      policy_name:
                        type: string
                      reservation_total:
                        type: string
                      cancellation_fee:
                        type: string
                      refund_amount:
                        type: string
                      fee_percentage:
                        type: number
                      is_refundable:
                        type: boolean
                      within_free_cancellation:
                        type: boolean
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/hotels/{hotel_id}/cancellation_policies:
    get:
      summary: List hotel cancellation policies
      description: List cancellation policies for a specific hotel
      operationId: listHotelCancellationPolicies
      tags:
        - Cancellation Policies
      parameters:
        - $ref: '#/components/parameters/HotelId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: List of hotel cancellation policies
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CancellationPolicy'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      summary: Create hotel-specific cancellation policy
      operationId: createHotelCancellationPolicy
      tags:
        - Cancellation Policies
      parameters:
        - $ref: '#/components/parameters/HotelId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancellationPolicyInput'
      responses:
        '201':
          description: Hotel cancellation policy created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/CancellationPolicy'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: API key for AI agent authentication

  parameters:
    HotelId:
      name: hotel_id
      in: path
      required: true
      schema:
        type: integer
      description: Hotel ID
    
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
      description: Page number
    
    PerPage:
      name: per_page
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
      description: Items per page
    
    ResourceId:
      name: id
      in: path
      required: true
      schema:
        type: integer
      description: Resource ID

  schemas:
    Hotel:
      type: object
      required: [id, name, address, city, state, country, phone, email]
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: "Grand Hotel"
        subdomain:
          type: string
          example: "grand"
        address:
          type: string
          example: "123 Main Street"
        city:
          type: string
          example: "New York"
        state:
          type: string
          example: "NY"
        country:
          type: string
          example: "USA"
        postal_code:
          type: string
          example: "10001"
        phone:
          type: string
          example: "+1-212-555-0100"
        email:
          type: string
          format: email
          example: "info@grandhotel.com"
        website:
          type: string
          format: uri
          nullable: true
          example: "https://grandhotel.com"
        description:
          type: string
        check_in_time:
          type: string
          format: time
          example: "15:00"
        check_out_time:
          type: string
          format: time
          example: "11:00"
        timezone:
          type: string
          example: "America/New_York"
        star_rating:
          type: string
          pattern: '^[0-5](\.[0-9])?$'
          nullable: true
          example: "4.5"
        total_rooms:
          type: integer
          example: 250

    Room:
      type: object
      required: [id, room_number, floor, status, room_type_id, hotel_id]
      properties:
        id:
          type: integer
        room_number:
          type: string
          example: "101"
        floor:
          type: string
          example: "1"
        status:
          type: string
          enum: [available, occupied, maintenance, cleaning]
        is_smoking:
          type: boolean
          default: false
        last_cleaned_at:
          type: string
          format: date-time
          nullable: true
        notes:
          type: string
          nullable: true
        room_type_id:
          type: integer
        hotel_id:
          type: integer
        room_type:
          $ref: '#/components/schemas/RoomTypeBasic'

    RoomType:
      type: object
      required: [id, name, code, base_price, standard_occupancy, max_occupancy]
      properties:
        id:
          type: integer
        name:
          type: string
          example: "Deluxe Suite"
        code:
          type: string
          example: "DLX"
        description:
          type: string
          nullable: true
        base_price:
          type: string
          pattern: '^\d+(\.\d{1,2})?$'
          example: "299.99"
        standard_occupancy:
          type: integer
          example: 2
        max_occupancy:
          type: integer
          example: 4
        extra_person_charge:
          type: string
          pattern: '^\d+(\.\d{1,2})?$'
          example: "50.00"
        size_sqm:
          type: string
          pattern: '^\d+(\.\d+)?$'
          nullable: true
          example: "45.5"

    RoomTypeBasic:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        code:
          type: string

    RoomTypeAvailability:
      type: object
      properties:
        room_type:
          $ref: '#/components/schemas/RoomType'
        available_count:
          type: integer
          example: 5
        total_price:
          type: string
          pattern: '^\d+(\.\d{1,2})?$'
          example: "899.97"
        nights:
          type: integer
          example: 3

    Guest:
      type: object
      required: [id, first_name, last_name, email]
      properties:
        id:
          type: integer
        first_name:
          type: string
        last_name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
          nullable: true
        date_of_birth:
          type: string
          format: date
          nullable: true
        nationality:
          type: string
          nullable: true
        address:
          type: string
          nullable: true
        city:
          type: string
          nullable: true
        state:
          type: string
          nullable: true
        country:
          type: string
          nullable: true
        postal_code:
          type: string
          nullable: true
        vip_status:
          type: boolean
        notes:
          type: string
          nullable: true

    Reservation:
      type: object
      required: [id, confirmation_number, check_in_date, check_out_date, status, adults, total_amount]
      properties:
        id:
          type: integer
        confirmation_number:
          type: string
          example: "20240120A3F"
        check_in_date:
          type: string
          format: date
        check_out_date:
          type: string
          format: date
        actual_check_in:
          type: string
          format: date-time
          nullable: true
        actual_check_out:
          type: string
          format: date-time
          nullable: true
        status:
          type: string
          enum: [pending, confirmed, checked_in, checked_out, cancelled, no_show]
        adults:
          type: integer
          minimum: 1
        children:
          type: integer
          minimum: 0
        infants:
          type: integer
          minimum: 0
        total_amount:
          type: string
          pattern: '^\d+(\.\d{1,2})?$'
          example: "299.99"
        paid_amount:
          type: string
          pattern: '^\d+(\.\d{1,2})?$'
          example: "0.00"
        payment_status:
          type: string
          enum: [pending, partial, paid, refunded]
        currency:
          type: string
          default: "USD"
        source:
          type: string
          enum: [walk_in, phone, website, ota]
        special_requests:
          type: string
          nullable: true
        internal_notes:
          type: string
          nullable: true
        hotel_id:
          type: integer
        guest_id:
          type: integer
        room_id:
          type: integer
          nullable: true
        room_type_id:
          type: integer
        guest:
          $ref: '#/components/schemas/Guest'
        room:
          oneOf:
            - $ref: '#/components/schemas/Room'
            - type: 'null'
        room_type:
          $ref: '#/components/schemas/RoomTypeBasic'

    ReservationCreateRequest:
      type: object
      required: [room_type_id, check_in_date, check_out_date, adults, guest]
      properties:
        room_type_id:
          type: integer
        check_in_date:
          type: string
          format: date
        check_out_date:
          type: string
          format: date
        adults:
          type: integer
          minimum: 1
        children:
          type: integer
          minimum: 0
          default: 0
        infants:
          type: integer
          minimum: 0
          default: 0
        special_requests:
          type: string
        source:
          type: string
          enum: [walk_in, phone, website, ota]
          default: website
        guest:
          type: object
          properties:
            id:
              type: integer
              description: Existing guest ID (if known)
            first_name:
              type: string
              description: Required for new guests, optional when ID provided
            last_name:
              type: string
              description: Required for new guests, optional when ID provided
            email:
              type: string
              format: email
              description: Required for new guests, optional when ID provided
            phone:
              type: string
            address:
              type: string
            city:
              type: string
            state:
              type: string
            country:
              type: string
            postal_code:
              type: string

    ReservationUpdateRequest:
      type: object
      properties:
        check_in_date:
          type: string
          format: date
        check_out_date:
          type: string
          format: date
        room_id:
          type: integer
          nullable: true
        room_type_id:
          type: integer
        adults:
          type: integer
          minimum: 1
        children:
          type: integer
          minimum: 0
        infants:
          type: integer
          minimum: 0
        status:
          type: string
          enum: [pending, confirmed, checked_in, checked_out, cancelled, no_show]
        special_requests:
          type: string
          nullable: true
        internal_notes:
          type: string
          nullable: true

    PaginationMeta:
      type: object
      properties:
        current_page:
          type: integer
        total_pages:
          type: integer
        total_count:
          type: integer
        per_page:
          type: integer
        from:
          type: integer
        to:
          type: integer

    PaginationLinks:
      type: object
      properties:
        self:
          type: string
          format: uri
        first:
          type: string
          format: uri
        last:
          type: string
          format: uri
        prev:
          type: string
          format: uri
        next:
          type: string
          format: uri

    HotelPolicy:
      type: object
      required: [id, policy_type, title, is_active]
      properties:
        id:
          type: integer
        policy_type:
          type: string
          enum: [check_in, check_out, cancellation, pet, smoking, children, other]
        title:
          type: string
          example: "Pet Policy"
        description:
          type: string
          example: "Pets are welcome with a $50 per night fee"
        sort_order:
          type: integer
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    
    Amenity:
      type: object
      required: [id, name, category]
      properties:
        id:
          type: integer
        name:
          type: string
          example: "Swimming Pool"
        category:
          type: string
          enum: [room, hotel, bathroom, kitchen, entertainment, accessibility, business, family, outdoor, wellness]
        icon:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        is_countable:
          type: boolean
    
    HotelAmenity:
      type: object
      required: [id, amenity_id, is_available, is_free]
      properties:
        id:
          type: integer
        amenity_id:
          type: integer
        is_available:
          type: boolean
        is_free:
          type: boolean
        additional_cost:
          type: string
          pattern: '^\d+(\.\d{1,2})?$'
          nullable: true
        location:
          type: string
          nullable: true
        operating_hours:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
        amenity:
          $ref: '#/components/schemas/Amenity'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    
    Service:
      type: object
      required: [id, name, category, price, is_active]
      properties:
        id:
          type: integer
        name:
          type: string
          example: "Room Service"
        category:
          type: string
          enum: [spa, dining, transport, laundry, other]
        description:
          type: string
          nullable: true
        price:
          type: string
          pattern: '^\d+(\.\d{1,2})?$'
        pricing_unit:
          type: string
          enum: [fixed, per_person, per_hour, per_item]
          default: fixed
        duration_minutes:
          type: integer
          nullable: true
        capacity:
          type: integer
          nullable: true
        advance_booking_required:
          type: boolean
          default: false
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    
    HotelDetailed:
      allOf:
        - $ref: '#/components/schemas/Hotel'
        - type: object
          properties:
            hotel_policies:
              type: array
              items:
                $ref: '#/components/schemas/HotelPolicy'
            hotel_amenities:
              type: array
              items:
                $ref: '#/components/schemas/HotelAmenity'
            services:
              type: array
              items:
                $ref: '#/components/schemas/Service'
    
    ErrorResponse:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
        message:
          type: string
        status:
          type: integer
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              code:
                type: string
              message:
                type: string

    MaintenanceRequest:
      type: object
      properties:
        id:
          type: integer
        category:
          type: string
          enum: [electrical, plumbing, hvac, furniture, other]
        issue_description:
          type: string
        priority:
          type: string
          enum: [low, normal, high, critical]
        status:
          type: string
          enum: [open, in_progress, pending_parts, completed, cancelled]
        scheduled_date:
          type: string
          format: date
          nullable: true
        cost_estimate:
          type: string
          description: Estimated cost as decimal string
          nullable: true
        actual_cost:
          type: string
          description: Actual cost as decimal string
          nullable: true
        resolution_notes:
          type: string
          nullable: true
        completed_at:
          type: string
          format: date-time
          nullable: true
        hotel_id:
          type: integer
        room_id:
          type: integer
          nullable: true
        reported_by_id:
          type: integer
        assigned_to_id:
          type: integer
          nullable: true
        room:
          $ref: '#/components/schemas/Room'
          nullable: true
        reported_by:
          type: object
          properties:
            id:
              type: integer
            email:
              type: string
            first_name:
              type: string
            last_name:
              type: string
        assigned_to:
          type: object
          nullable: true
          properties:
            id:
              type: integer
            email:
              type: string
            first_name:
              type: string
            last_name:
              type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        location_description:
          type: string
          description: Room number or "Common Area"
        days_open:
          type: integer
          description: Number of days the request has been open
        cost_variance:
          type: string
          description: Difference between actual and estimated cost
          nullable: true
        cost_variance_percentage:
          type: number
          description: Percentage variance between actual and estimated cost
          nullable: true

    Error:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
        message:
          type: string
    
    HousekeepingTask:
      type: object
      properties:
        id:
          type: integer
        task_type:
          type: string
          enum: [cleaning, inspection, turndown, deep_clean]
        priority:
          type: string
          enum: [low, normal, high, urgent]
        status:
          type: string
          enum: [pending, in_progress, completed, cancelled]
        scheduled_date:
          type: string
          format: date
        scheduled_time:
          type: string
          pattern: '^([01]?[0-9]|2[0-3]):[0-5][0-9]$'
          nullable: true
        started_at:
          type: string
          format: date-time
          nullable: true
        completed_at:
          type: string
          format: date-time
          nullable: true
        inspection_score:
          type: integer
          minimum: 1
          maximum: 10
          nullable: true
        notes:
          type: string
          nullable: true
        hotel_id:
          type: integer
        room_id:
          type: integer
        assigned_to_id:
          type: integer
          nullable: true
        room:
          $ref: '#/components/schemas/Room'
        assigned_to:
          type: object
          nullable: true
          properties:
            id:
              type: integer
            email:
              type: string
            first_name:
              type: string
            last_name:
              type: string
        is_overdue:
          type: boolean
        duration_minutes:
          type: integer
          nullable: true
        scheduled_datetime:
          type: string
          format: date-time
    
    HousekeepingTaskDetailed:
      allOf:
        - $ref: '#/components/schemas/HousekeepingTask'
