      operationId: previewQuery
      tags: [Data Agent]
      description: |
        Executes a read-only SQL query with automatic tenant scoping and returns
        a limited preview of results. Queries are validated for safety and automatically
        filtered by the current account context.
        
        Important limitations:
        - Only SELECT queries are allowed
        - Results are automatically limited (max 1000 rows)
        - Queries are scoped to current account's data
        - Execution timeout of 30 seconds
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sql]
              properties:
                sql:
                  type: string
                  description: SQL SELECT query to execute
                  example: "SELECT status, COUNT(*) FROM reservations GROUP BY status"
                max_rows:
                  type: integer
                  minimum: 1
                  maximum: 1000
                  default: 100
                  description: Maximum number of rows to return
      responses:
        '200':
          description: Query executed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/QueryResult'
        '400':
          description: Invalid query or query error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '408':
          description: Query timeout
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Query Timeout"
                  message:
                    type: string
                    example: "Query execution exceeded 30 second timeout"
                  status:
                    type: integer
                    example: 408

