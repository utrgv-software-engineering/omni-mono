# Azure Deployment Configuration for Hotel Management System
# Used by rocketship.py for deployment setup
#
# Environment variables (from .env) are substituted at runtime using ${VAR_NAME} syntax

image: hotel-mng/app
registry:
  server: ${AZURE_REGISTRY_SERVER}
  username: ${AZURE_REGISTRY_USERNAME}
  password: ${ROCKETSHIP_REGISTRY_PASSWORD}
service: hotel-mng
github:
  repo: ${GITHUB_REPO}
azure:
  subscription: ${AZURE_SUBSCRIPTION_ID}
  app_service:
    app_name: ${AZURE_APP_NAME}
    resource_group: ${AZURE_RESOURCE_GROUP}
    # Using Azure Database for PostgreSQL Flexible Server (managed)
    additional_env:
      DATABASE_URL: ${DATABASE_URL}

      ACTIVE_STORAGE_PATH: /home/app/storage/
      WEBSITES_ENABLE_APP_SERVICE_STORAGE: "true"

      # Rails configuration
      RAILS_ENV: production
      RAILS_LOG_TO_STDOUT: "true"
      RAILS_SERVE_STATIC_FILES: "true"

      # Container settings
      WEBSITES_PORT: "80"
      WEBSITES_CONTAINER_START_TIME_LIMIT: "600"

      # Platform admin credentials (used when seeding database)
      PLATFORM_ADMIN_EMAIL: ${PLATFORM_ADMIN_EMAIL}
      PLATFORM_ADMIN_PASSWORD: ${PLATFORM_ADMIN_PASSWORD}

      # Rails secrets (read from .env)
      RAILS_MASTER_KEY: ${RAILS_MASTER_KEY}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}

      # Eval API for student agent testing
      ALLOW_EVAL_API: "true"
      EVAL_API_TOKEN: ${EVAL_API_TOKEN}
