# see https://github.com/ankane/blazer for more info

data_sources:
  main:
    # Use the main database URL with read-only user in production
    url: <%= ENV["BLAZER_DATABASE_URL"] || ENV["DATABASE_URL"] %>

    # statement timeout, in seconds
    timeout: 30

    # caching settings for better performance
    cache:
      mode: slow
      expires_in: 60 # min
      slow_threshold: 5 # sec

    # use read-only transaction for safety
    use_transaction: true

    # Smart variables for common filters
    smart_variables:
      hotel_id: "SELECT id, name FROM hotels WHERE account_id = {account_id} ORDER BY name ASC"
      room_type_id: "SELECT id, name FROM room_types WHERE account_id = {account_id} ORDER BY name ASC"
      guest_id: "SELECT id, CONCAT(first_name, ' ', last_name) as name FROM guests WHERE account_id = {account_id} ORDER BY last_name, first_name ASC"
      reservation_status: ["pending", "confirmed", "checked_in", "checked_out", "cancelled", "no_show"]
      room_status: ["available", "occupied", "maintenance", "cleaning"]
      housekeeping_status: ["pending", "in_progress", "completed", "requires_inspection"]
      priority: ["low", "normal", "high", "urgent"]
      service_category: ["spa", "restaurant", "room_service", "laundry", "concierge", "other"]

    # Link to records in your app
    linked_columns:
      hotel_id: "/hotels/{value}"
      room_id: "/hotels/{hotel_id}/rooms/{value}"
      room_type_id: "/hotels/{hotel_id}/room_types/{value}"
      guest_id: "/guests/{value}"
      reservation_id: "/reservations/{value}"
      user_id: "/account_users"
      account_user_id: "/account_users/{value}"

    # Smart columns for ID lookups
    smart_columns:
      hotel_id: "SELECT id, name FROM hotels WHERE id IN {value} AND account_id = {account_id}"
      room_type_id: "SELECT id, name FROM room_types WHERE id IN {value} AND account_id = {account_id}"
      guest_id: "SELECT id, CONCAT(first_name, ' ', last_name) as name FROM guests WHERE id IN {value} AND account_id = {account_id}"
      user_id: "SELECT users.id, CONCAT(users.first_name, ' ', users.last_name) as name FROM users INNER JOIN account_users ON account_users.user_id = users.id WHERE users.id IN {value} AND account_users.account_id = {account_id}"
      room_id: "SELECT id, room_number FROM rooms WHERE id IN {value} AND account_id = {account_id}"
      status: {0: "Inactive", 1: "Active"}

# create audits for all queries
audit: true

# use account timezone if available
time_zone: "<%= ActsAsTenant.current_tenant&.timezone || 'UTC' %>"

# user model configuration
user_class: User
user_method: current_user
user_name: display_name

# custom authentication method
before_action_method: require_blazer_authentication

# email settings for alerts
from_email: <%= ENV["BLAZER_FROM_EMAIL"] || "reports@hotel-system.com" %>

# webhook for Slack notifications
slack_webhook_url: <%= ENV["BLAZER_SLACK_WEBHOOK_URL"] %>

# check schedules
check_schedules:
  - "1 day"
  - "1 hour"
  - "5 minutes"

# enable anomaly detection (requires additional gems)
# anomaly_checks: prophet

# enable forecasting (requires additional gems)
# forecasting: prophet

# enable map visualizations
mapbox_access_token: <%= ENV["MAPBOX_ACCESS_TOKEN"] %>

# enable CSV uploads for ad-hoc analysis
# uploads:
#   url: <%= ENV["BLAZER_UPLOADS_URL"] %>
#   schema: uploads
#   data_source: main

# async query execution for better performance
async: <%= Rails.env.production? %>

# override content security policy
override_csp: true