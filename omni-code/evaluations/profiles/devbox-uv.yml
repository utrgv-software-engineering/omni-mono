# devbox + Python (uv) toolchain, for scenarios whose task and verification
# run `uv run ...` (e.g. the fitness_tracker autopilot). The base image ships
# python/node/jq/git but not uv, so an init hook installs it into the
# container — the scenario's environment carries the scenario's compute, which
# is the whole point of running in a sandbox. Network is open (no isolation),
# as the agent legitimately needs to `uv sync` / `npm install`.
version: 1

client:
  type: docker

options:
  image: ghcr.io/ericmichael/omni-code-sandbox-work@sha256:7d097a4f9a00155a9c9299c32657e4b2960bd486cd653863603d89c5345d94c4

init:
  # Install uv to a PATH location so the agent and the verification commands
  # can both `uv run`. Runs as root at container start (before the agent run).
  - "curl -LsSf https://astral.sh/uv/install.sh | env UV_INSTALL_DIR=/usr/local/bin INSTALLER_NO_MODIFY_PATH=1 sh"
