# Pinned sandbox profile for evaluations ("environment in container").
#
# The image is omni-code's OWN eval image, built from evaluations/Dockerfile
# and published by .github/workflows/build-eval-image.yml. It carries exactly
# the toolchain the fixtures/scenarios exercise (git/rg, python+uv,
# iptables) — the launcher's desktop
# devbox (omni-code-sandbox-work / omni-launcher-devbox) is a different
# product surface and is deliberately NOT used here.
#
# Resolved via omniagents.core.sandbox.profiles.resolve_product_profile
# (explicit_path=...), which merges ONLY this file over the built-in
# default and SKIPS the user/project layers — so eval runs are hermetic
# and reproducible regardless of whatever sandbox config the host machine
# happens to have.
#
# A scenario opts into this environment with:
#
#   environment:
#     profile: evaluations/profiles/devbox.yml
#
# The image is pinned by digest (a :latest tag drifts; a digest does not), so
# the experiment runs in the same world every time. The workspace is NOT
# defined here — the eval environment injects the staged fixture as the
# container's /workspace at runtime (profile = container shape; workspace =
# per-scenario concern, same split `omni serve` uses).
version: 1

client:
  type: docker

options:
  image: ghcr.io/ericmichael/omni-code-eval@sha256:5dcc07ed0532068eae155c3ab08973eb5f1900bfef8bf28552561a472660ac85

# run_as: "1000:1000"   # optional non-root identity (defense-in-depth);
#                       # left as root for now — the container is throwaway.
