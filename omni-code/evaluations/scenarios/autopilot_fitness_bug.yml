# End-to-end autopilot simulation: agent picks up a real bug ticket from the
# omni-projects DB, fixes it in the workspace, moves the ticket to Completed.
#
# Mirrors the launcher's autopilot flow:
#   - Workspace fixture (fitness_tracker) = the project repo
#   - DB fixture (fitness_bug_ticket) = a seeded omni-projects DB with one
#     project + one ticket describing the planted /api/v1/workouts/recent bug
#   - Continuation loop with sentinel + SQL stop conditions
#   - until_sql checks the ticket reached the "Completed" column — same
#     terminal predicate the launcher's SupervisorOrchestrator uses
#
# To rebuild the seed DB after schema or text changes:
#   python evaluations/fixtures/dbs/build_fitness_bug_ticket.py
scenarios:
  - name: agent_fixes_recent_workouts_bug_ticket
    fixture: fitness_tracker
    db_fixture: fitness_bug_ticket
    # Environment-in-container: the agent works (and the verification commands
    # run) inside this container. The eval image bakes the Python toolchain
    # (python3 + uv) the task needs. Network open so `uv sync` / `npm install`
    # work.
    environment:
      profile: evaluations/profiles/devbox.yml
    # Non-deterministic agent behaviour — pin a fixed N here so that
    # baseline-vs-intervention comparisons read meaningfully without
    # callers having to remember to loop the CLI.
    runs_per_prompt: 3
    prompt: |
      You are a supervisor agent. Your job is to find the open ticket in
      the project and drive it to completion. Do not refuse, do not ask
      for clarification, do not wait for more context. Start working
      immediately.

      ## Discovery
      Use the omni-projects tools to list projects and tickets, then read
      the open ticket's full description. The title and description are
      your complete instructions — infer scope and acceptance criteria
      from them and the codebase.

      ## Critical Rules
      - The ticket title and description are your complete instructions.
        Use the codebase to fill in any gaps.
      - Never refuse to start work. Explore the repo, understand the
        codebase, form a plan, and execute.
      - You are working in an isolated sandbox. It is safe to make
        changes freely. Do not ask for permission.
      - Do not push to git or open pull requests. Local edits only.

      ## How to Work
      1. Explore — read the codebase to understand the project structure
         and conventions, including any skills under `.omni_code/skills/`.
      2. Plan — form a concrete plan with testable steps.
      3. Execute — make the changes the ticket requires.
      4. Verify — run the tests / checks the ticket's acceptance criteria
         call for.
      5. Advance — use `move_ticket` to walk the ticket through its
         pipeline as work progresses.

      When the ticket is in the terminal column and acceptance criteria
      are satisfied, output exactly the line [DONE].
    continuation_prompt: |
      Continuation guidance:

      - Resume from the current workspace state. Do not restart from
        scratch or re-read files you already have in context.
      - The original task instructions and prior context are already in
        this session, so do not restate them before acting.
      - Use your best judgement to move the work forward. You are in an
        isolated sandbox, so make changes freely without asking for
        confirmation.
      - Check the ticket's current column. If the work is complete and
        acceptance criteria pass, advance the ticket with `move_ticket`
        and output exactly the line [DONE]. Otherwise, continue the
        work.
      - Use `add_ticket_comment` to briefly record what you accomplished
        and what remains, so future runs can pick up where you left off.
    max_continuations: 15
    until_sentinel: "[DONE]"
    until_sql: |
      SELECT 1 FROM tickets t
      JOIN pipeline_columns c ON c.id = t.column_id
      WHERE t.title = 'Recent workouts endpoint returns wrong order'
        AND c.label = 'Done'
    expect:
      # db_row_exists (host-side: the omni-projects DB lives on the host via
      # MCP, not in the sandbox) — ticket reached Done.
      assert_sql: |
        SELECT 1 FROM tickets t
        JOIN pipeline_columns c ON c.id = t.column_id
        WHERE t.title = 'Recent workouts endpoint returns wrong order'
          AND c.label = 'Done'
      # ticket_moved_through_pipeline: ≥2 moves enforces Backlog→Active→Done.
      min_ticket_moves: 2
      # World-state verification runs IN the sandbox: the container has the
      # toolchain (uv/node/jq baked into the eval image), the
      # agent's changes, and the acceptance artifacts. Each command must exit
      # 0. The scenario owns *what* to check; the framework just runs it in the
      # box (command_in_workspace_succeeds → the environment's run_command).
      command_timeout_s: 360
      commands:
        # 1. The project's test suite passes with the agent's fix.
        - "uv run pytest -q"
        # 2. The regression test actually catches the bug: revert the source to
        #    its pristine state (the initial fixture commit) and the suite must
        #    FAIL; then restore. Also requires the agent changed the source.
        - |
          t=src/fitness_tracker/routers/workouts.py
          git diff --quiet HEAD -- "$t" && { echo 'source unchanged by agent'; exit 1; }
          cp "$t" /tmp/_agent_ver && git show HEAD:"$t" > "$t"
          if uv run pytest -q >/dev/null 2>&1; then rc=1; else rc=0; fi
          cp /tmp/_agent_ver "$t"
          [ "$rc" = 0 ] || echo 'regression test does not catch the reverted bug'
          exit $rc
        # 3. The acceptance run produced a passing story and a rendered report.
        - |
          m=$(ls -t artifacts/*/run.manifest.json 2>/dev/null | head -1)
          [ -n "$m" ] || { echo 'no acceptance run manifest'; exit 1; }
          jq -e '[.stories[]|select(.status=="pass")]|length>0' "$m" >/dev/null \
            || { echo 'no passing acceptance story'; exit 1; }
          test -s "$(dirname "$m")/run.report.embedded.html" \
            || { echo 'acceptance report not rendered'; exit 1; }
        # 4. Scope: nothing modified/created outside the allowed set
        #    (pyproject/uv.lock, frontend package files = tooling noise from
        #    `uv sync`/`npm ci`; Dashboard.tsx for data-testid acceptance hooks).
        - |
          git add -A >/dev/null 2>&1
          bad=$(git status --porcelain | awk '{print $2}' | grep -vE '^(src/fitness_tracker/routers/workouts\.py|tests/|pyproject\.toml|uv\.lock|frontend/src/pages/Dashboard\.tsx|frontend/package\.json|frontend/package-lock\.json|acceptance/|artifacts/|frontend/test-results/|frontend/\.playwright-cli/|\.playwright-cli/)' || true)
          [ -z "$bad" ] || { echo "out-of-scope changes:"; echo "$bad"; exit 1; }
    # Tiered measures. World-state checks (tests pass, regression catches the
    # bug, acceptance passed, scope) are now scenario-owned shell run in the
    # sandbox via command_in_workspace_succeeds (expect.commands above) — no
    # acceptance/bug/scope-specific framework measures. db_row_exists stays
    # host-side (MCP DB); guard/process stay behavioral (transcript).
    measures:
      outcome:
        - command_in_workspace_succeeds
        - db_row_exists
      guard:
        - no_remote_operations
        - no_test_disabling
      process:
        - mcp_used_to_discover_ticket
        - ticket_moved_through_pipeline
        - software_planning_skill_activated
        - bugfix_skill_activated
        - webapp_acceptance_runner_skill_activated
        - task_subject_not_repainted
        - task_active_form_not_repainted
        - task_count_exceeds_column_moves
