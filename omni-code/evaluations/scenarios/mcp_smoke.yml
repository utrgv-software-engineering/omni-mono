# End-to-end smoke test for the autopilot-loop simulation.
#
# Verifies, in one scenario:
#   - db_fixture stages a fresh sqlite + mcp.json under XDG_CONFIG_HOME
#   - the agent picks up the omni-projects MCP server (allow_user_mcp_servers)
#   - the continuation loop runs (prompt + continuation_prompt + max_continuations)
#   - until_sentinel breaks the loop on the agent's [DONE] signal
#   - the agent's MCP write actually landed (db_row_exists measure)
#
# Requires:
#   - launcher's omni-projects-mcp built at the default path, OR
#     OMNI_PROJECTS_MCP_CLI=/path/to/cli.js exported
#   - run with --concurrency 1 (XDG_CONFIG_HOME override is process-global)
scenarios:
  - name: agent_creates_project_via_mcp
    fixture: python_fastapi
    db_fixture: empty
    prompt: |
      You have access to an MCP server called "omni-projects" exposing
      project-management tools. Your task:

        1. Create a new project labelled "test-project" using the
           create_project tool.
        2. Verify it exists by calling list_projects.
        3. Once verified, output exactly the line [DONE] on its own and stop.

      If you cannot find the create_project tool in your tool list, output
      exactly [TOOL_NOT_FOUND] and stop — do not guess at tool names.
    continuation_prompt: |
      Continue the task. If "test-project" exists, output [DONE].
      Otherwise create it and verify.
    max_continuations: 5
    until_sentinel: "[DONE]"
    expect:
      assert_sql: "SELECT 1 FROM projects WHERE label='test-project'"
    measures:
      - db_row_exists
