name: explorer
label: Explorer
description: "Fast read-only codebase exploration sub-agent"
instructions_file: instructions.md

# LLM-facing description used when this agent is exposed via
# `agent_tools:` (Agent.as_tool()). agent_tools entries that omit their
# own `tool_description:` fall back to this — single source of truth.
tool_description: |
  Ask a read-only sub-agent to explore the codebase and answer a
  question. Use this for broad codebase exploration when you need to
  search across multiple files or don't know where to look (e.g.
  "how is authentication implemented?", "find all API route
  definitions", "what files handle database migrations?").

  For targeted lookups of a specific file or symbol you already know
  about, use read_file or grep_files directly — they are faster.

  You can run multiple explore calls in parallel when investigating
  different aspects of the codebase.

# Read-only exploration surface. `filesystem_readonly` is intentionally
# narrower than the full `filesystem` cap — no write/edit/apply_patch.
capabilities:
  - filesystem_readonly
  - notebook_readonly

model_settings:
  reasoning:
    effort: low
  parallel_tool_calls: true

max_turns: 50

# Headless subagent — runs inside the parent's session via
# Agent.as_tool(). Today the parent's configure_tool_approval walk
# doesn't descend into agent_tools so predicates aren't attached, but
# this line keeps the explorer headless if it's ever switched back to
# its own LocalAgent/AgentService (see worker/agent.yml for the same
# reason).
use_safe_agent: false

model_config_resolver: resolve_default_model

session:
  compaction:
    enabled: true
    model: gpt-5.2
    compaction_mode: auto
