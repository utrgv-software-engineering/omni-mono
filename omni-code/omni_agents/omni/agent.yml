name: omni
label: Omni Code
description: "Full-stack coding agent with workspace access"
instructions_file: instructions.md
welcome_text: |
  Welcome to Omni Code! I'm here to help you with your coding needs.

tools:
  - read_image
  - dispatch
  - explore
  - list_directory
  - read_file
  - display_artifact
  - apply_patch
  - write_file
  - execute_bash
  - bash_status
  - bash_logs
  - bash_kill
  - web_fetch
  - web_search
  - youtube_search
  - scholar_search
  - download_file
  - convert_to_markdown
  - read_notebook
  - edit_notebook
  - spawn_worker
  - get_worker_status
  - wait_for_workers
  - send_worker_message
  - close_worker
  - resume_worker
  - cleanup_worker_worktree
  - task_create
  - task_list
  - task_get
  - task_update
  - load_skill

model_settings:
  reasoning:
    effort: low
  parallel_tool_calls: true

max_turns: 10000

use_safe_agent: true
safe_agent_options:
  skip_approvals: false
  halt_on_rejection: true
  safe_tool_names:
    - read_image
    - list_directory
    - glob_files
    - grep_files
    - read_file
    - display_artifact
    - dispatch
    - bash_status
    - bash_logs
    - web_fetch
    - web_search
    - youtube_search
    - scholar_search
    - convert_to_markdown
    - read_notebook
    - explore
    - get_worker_status
    - wait_for_workers
    - send_worker_message
    - close_worker
    - resume_worker
    - task_create
    - task_list
    - task_get
    - task_update
    - load_skill

server_functions:
  - help
  - artifact
  - good
  - bad
  - note
  - notes
  - compact
  - models
  - model
  - voice-models
  - voice-model
  - reasoning
  - terminal.create
  - terminal.close
  - bash_jobs.list
  - bash_jobs.kill
  - bash_jobs.tail
  - bj-list
  - bj-kill
  - bj-logs
  - fs_get_cwd
  - fs_get_workspace_root
  - fs_get_home
  - fs_list_dir
  - session_ensure

context: build_coding_context
model_config_resolver: resolve_default_model
variables: {}

# SDK 0.16+ proactive compaction. Wraps the session with
# OpenAIResponsesCompactionSession so OpenAI's responses.compact endpoint
# trims context after each turn (default trigger: >=10 candidate items).
# Only runs against OpenAI Responses models; for other providers the wrap
# helper logs a warning and falls back to the unwrapped session, leaving
# the on_error reactive-compaction path as the safety net.
session:
  compaction:
    enabled: true
    model: gpt-5.2
    compaction_mode: auto
