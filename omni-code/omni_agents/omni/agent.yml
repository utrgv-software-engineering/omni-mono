name: omni
label: Omni Code
description: "Full-stack coding agent with workspace access"
instructions_file: instructions.md
welcome_text: |
  Welcome to Omni Code! I'm here to help you with your coding needs.

tools:
  - read_image
  - dispatch
  - list_directory
  - read_file
  - display_artifact
  - apply_patch
  - write_file
  - execute_bash
  # bash_*: only useful once at least one background job exists.
  # Hidden from the LLM's tool schema until then.
  - name: bash_status
    is_enabled: any_bash_jobs_exist
  - name: bash_logs
    is_enabled: any_bash_jobs_exist
  - name: bash_kill
    is_enabled: any_bash_jobs_exist
  - web_fetch
  - web_search
  - youtube_search
  - scholar_search
  - download_file
  - convert_to_markdown
  - read_notebook
  - edit_notebook
  - spawn_worker
  # worker consumer tools: only useful once at least one worker is spawned.
  - name: get_worker_status
    is_enabled: any_workers_exist
  - name: wait_for_workers
    is_enabled: any_workers_exist
  - name: send_worker_message
    is_enabled: any_workers_exist
  - name: close_worker
    is_enabled: any_workers_exist
  - name: resume_worker
    is_enabled: any_workers_exist
  - name: cleanup_worker_worktree
    is_enabled: any_workers_exist
  - task_create
  - task_list
  - task_get
  - task_update
  - load_skill

model_settings:
  reasoning:
    effort: low
  parallel_tool_calls: true

max_turns: 10000

use_safe_agent: true
safe_agent_options:
  skip_approvals: false
  halt_on_rejection: true
  safe_tool_names:
    - read_image
    - list_directory
    - glob_files
    - grep_files
    - read_file
    - display_artifact
    - dispatch
    - bash_status
    - bash_logs
    - web_fetch
    - web_search
    - youtube_search
    - scholar_search
    - convert_to_markdown
    - read_notebook
    - explore
    - get_worker_status
    - wait_for_workers
    - send_worker_message
    - close_worker
    - resume_worker
    - task_create
    - task_list
    - task_get
    - task_update
    - load_skill

server_functions:
  - help
  - artifact
  - good
  - bad
  - note
  - notes
  - compact
  - models
  - model
  - voice-models
  - voice-model
  - reasoning
  - terminal.create
  - terminal.close
  - bash_jobs.list
  - bash_jobs.kill
  - bash_jobs.tail
  - bj-list
  - bj-kill
  - bj-logs
  - fs_get_cwd
  - fs_get_workspace_root
  - fs_get_home
  - fs_list_dir
  - session_ensure

context: build_coding_context
model_config_resolver: resolve_default_model
variables: {}

# Sub-agents exposed as callable function tools via Agent.as_tool().
# The sub-agent inherits the parent's RunConfig (model_provider with
# credentials) and the parent's RunContextWrapper (workspace_root,
# session vars). Its own model_config_resolver picks up the user's
# currently-selected model from omni-code's models.json so the explorer
# follows the parent's model selection rather than the provider default.
agent_tools:
  - yaml: ../explorer/agent.yml
    tool_name: explore
    # tool_description omitted — falls back to explorer's own
    # tool_description so the LLM contract stays consistent across callers.

# SDK 0.16+ proactive compaction. Wraps the session with
# OpenAIResponsesCompactionSession so the Responses ``compact`` endpoint
# trims context after each turn (default trigger: >=10 candidate items).
# The wrap helper builds a dedicated AsyncOpenAI client from the resolved
# model_config (api_key + base_url) so this works against any endpoint
# that serves the Responses API — OpenAI proper, Azure /openai/v1, or a
# compatible proxy. If you point at a backend that doesn't implement
# ``responses.compact``, flip ``enabled: false`` here; the on_error
# reactive-compaction path remains the safety net either way.
session:
  compaction:
    enabled: true
    model: gpt-5.2
    compaction_mode: auto
