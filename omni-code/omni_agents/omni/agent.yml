name: omni
label: Omni Code
description: "Full-stack coding agent with workspace access"
instructions_file: instructions.md
welcome_text: |
  Welcome to Omni Code! I'm here to help you with your coding needs.

# Tool surface composed from capability packs (see capabilities/*.yml and
# omniagents builtin capabilities). Each cap bundles a tool family plus an
# instructions fragment. `shell` overrides the builtin single-tool shell
# with omni-code's job-tracking variant.
capabilities:
  - filesystem    # read/list/glob/grep/write/edit/apply_patch + read_image (builtin)
  - shell         # execute_bash + bash_status/logs/kill (omni-code override)
  - web           # web_fetch + download_file (builtin, provider-agnostic)
  - serpapi       # web_search / youtube_search / scholar_search (builtin)
  - markdown      # convert_to_markdown
  - notebook      # read_notebook / edit_notebook
  - workers       # spawn_worker family
  - tasks         # task_create / list / get / update
  - skills        # load_skill
  - slash         # dispatch
  - artifacts     # display_artifact (builtin)
  - exploration   # explorer subagent exposed as `explore`
  - goal          # goal_complete (signals /goal autopilot stop)
  - wakeup        # schedule_wakeup / cancel_wakeup (self-scheduled recurring notifications)
  - human         # notify / escalate (UI-implemented client tools)

model_settings:
  reasoning:
    effort: low
  parallel_tool_calls: true

max_turns: 10000

use_safe_agent: true
safe_agent_options:
  skip_approvals: false
  halt_on_rejection: true
  safe_tool_names:
    - read_image
    - list_directory
    - glob_files
    - grep_files
    - read_file
    - display_artifact
    - dispatch
    - bash_status
    - bash_logs
    - web_fetch
    - web_search
    - youtube_search
    - scholar_search
    - convert_to_markdown
    - read_notebook
    - explore
    - get_worker_status
    - wait_for_workers
    - send_worker_message
    - close_worker
    - resume_worker
    - task_create
    - task_list
    - task_get
    - task_update
    - load_skill
    - goal_complete
    - schedule_wakeup
    - cancel_wakeup
    - notify
    - escalate

server_functions:
  - help
  - artifact
  - good
  - bad
  - note
  - notes
  - compact
  - recap
  - models
  - model
  - voice-models
  - voice-model
  - reasoning
  - terminal.create
  - terminal.close
  - bash_jobs.list
  - bash_jobs.kill
  - bash_jobs.tail
  - bj-list
  - bj-kill
  - bj-logs
  - fs_get_cwd
  - fs_get_workspace_root
  - fs_get_sources
  - fs_get_home
  - fs_list_dir
  - session_ensure
  - goal
  - goal.stop
  - goal.status
  - wakeup.stop
  - wakeup.status

context: build_coding_context
model_config_resolver: resolve_default_model
variables: {}

# Sub-agent (explorer) is bundled into the `exploration` capability above
# via agent_tools: [{agent: explorer, tool_name: explore, ...}]. The
# sub-agent inherits the parent's RunConfig (model_provider with
# credentials) and the parent's RunContextWrapper (workspace_root, session
# vars). Its own model_config_resolver picks up the user's currently-
# selected model from omni-code's models.json so the explorer follows the
# parent's model selection rather than the provider default.

# SDK 0.16+ proactive compaction. Wraps the session with
# OpenAIResponsesCompactionSession so the Responses ``compact`` endpoint
# trims context after each turn (default trigger: >=10 candidate items).
# The wrap helper builds a dedicated AsyncOpenAI client from the resolved
# model_config (api_key + base_url) so this works against any endpoint
# that serves the Responses API — OpenAI proper, Azure /openai/v1, or a
# compatible proxy. If you point at a backend that doesn't implement
# ``responses.compact``, flip ``enabled: false`` here; the on_error
# reactive-compaction path remains the safety net either way.
session:
  compaction:
    enabled: true
    model: gpt-5.2
    compaction_mode: auto
