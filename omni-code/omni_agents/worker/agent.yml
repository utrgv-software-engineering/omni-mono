name: worker
label: Worker
description: "Autonomous coding worker for parallel subtasks"
instructions_file: instructions.md

additional_tools_dirs:
  - ../../tools

# Worker is a focused coding subagent — it gets the file/shell/notebook
# surface it needs to execute a task, plus task tracking and skills, but
# no nested workers, no slash dispatch, no exploration subagent (workers
# already operate on a focused task scope).
capabilities:
  - filesystem
  - shell
  - notebook
  - markdown
  - tasks
  - skills

model_settings:
  reasoning:
    effort: low
  parallel_tool_calls: true

max_turns: 200

# Headless subagent — spawned by WorkerManager (tools/worker_tools.py).
# omniagents' YAML loader defaults use_safe_agent to True when absent
# (omniagents/core/config/loader.py:1536); leaving it unset causes
# AgentService to attach needs_approval predicates with an empty safe
# list, so every tool call interrupts and round-trips through
# WorkerManager's auto-approve (workers.py:74-88) — which looks like a
# hang. Opt out explicitly.
use_safe_agent: false

context: build_worker_context
variables: {}

session:
  compaction:
    enabled: true
    model: gpt-5.2
    compaction_mode: auto
