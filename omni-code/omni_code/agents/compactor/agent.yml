name: compactor
label: Context Compactor
description: "Summarizes the current conversation context for continuation"
# instructions.md IS the checkpoint-summary prompt — omni-code owns
# every word this agent speaks; the framework injects nothing.
instructions_file: instructions.md

tools: []

# Headless subagent — this agent's name IS the install: the framework's
# compaction seam runs the project agent named `compactor` by convention
# via run_project_agent_once (bypasses AgentService entirely, so
# configure_tool_approval never runs against it). Empty tool list also
# makes hangs impossible.
# Setting use_safe_agent: false documents the intent and stays correct
# if this agent is ever moved onto AgentService.
use_safe_agent: false

model_settings:
  tool_choice: none

max_turns: 1

variables: {}
