name: recapper
label: Session Recapper
description: "Produces a short human-friendly recap of the current session"
# instructions.md IS the recap prompt — omni-code owns every word this
# agent speaks; the framework injects nothing.
instructions_file: instructions.md

tools: []

# Headless subagent — this agent's name IS the install: the framework's
# recap seam runs the project agent named `recapper` by convention via
# run_project_agent_once (bypasses AgentService entirely, so
# configure_tool_approval never runs against it). Empty tool list also
# makes hangs impossible.
# Setting use_safe_agent: false documents the intent and stays correct
# if this agent is ever moved onto AgentService.
use_safe_agent: false

model_settings:
  tool_choice: none

max_turns: 1

variables: {}
