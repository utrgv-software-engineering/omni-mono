name: session_summarizer
label: Session Summarizer
description: "Summarizes a past OmniAgents session for fast recall"
instructions_file: instructions.md

tools: []

# Headless subagent — invoked by omni_code/cli_extensions.py via direct
# Runner.run (bypasses AgentService entirely, so configure_tool_approval
# never runs against it). Setting use_safe_agent: false documents the
# intent and stays correct if this agent is ever moved onto AgentService.
use_safe_agent: false

model_settings:
  tool_choice: none

max_turns: 1

variables: {}
