name: worker
label: Worker
description: "Autonomous coding worker for parallel subtasks"
instructions_file: instructions.md

additional_tools_dirs:
  - ../../tools

# Worker is a focused coding subagent — it gets the file/shell/notebook
# surface it needs to execute a task, plus task tracking and skills, but
# no nested workers, no slash dispatch, no exploration subagent (workers
# already operate on a focused task scope).
capabilities:
  - filesystem
  - shell
  - notebook
  - markdown
  - tasks
  - skills

model_settings:
  reasoning:
    effort: low
  parallel_tool_calls: true

max_turns: 200

# Headless subagent — spawned by the framework worker tools via
# WorkerManager, which defaults spawned specs to
# safe_agent_options.skip_approvals=true (omniagents ≥0.7.19,
# _default_worker_safety): workers have no human reviewer, so approval
# prompts would only round-trip through the monitor's auto-approve.
# No use_safe_agent override needed here anymore; safety_mode: enforced
# deployments still re-enable approvals at the service layer.

context: build_worker_context
variables: {}

session:
  compaction:
    # Settings mirror agents/omni/agent.yml — see the full rationale there.
    enabled: true
    compaction_mode: auto
    threshold_fraction: 0.8
