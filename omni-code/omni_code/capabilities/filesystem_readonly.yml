name: filesystem_readonly
# Extends the omniagents builtin `filesystem_readonly` pack. Drops only
# `read_image` — the explorer is a text-research subagent. Discovery
# tools stay: the builtins ripgrep-accelerate themselves when `rg` is
# available in the workspace.
extends: filesystem_readonly
exclude_tools:
  - read_image
instructions_append: |
  Use `read_file` to inspect specific files after you have identified relevant
  paths. Do not modify files.
