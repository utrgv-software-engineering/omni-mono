name: workers
# Extends the omniagents builtin `workers` pack (same tools, server
# functions, and base instructions) with the coding-specific delta:
# worktree isolation + merge workflow and file-scoped task briefs.
extends: workers
instructions_append: |
  Coding specifics:
  - Include concrete file scope in every task brief — which files the
    worker owns — plus the conventions to follow; never give two
    concurrent workers overlapping files.
  - Prefer `isolation="worktree"`: each worker gets a git worktree on its
    own `worker/...` branch. Workers commit their changes; after the
    completion notification, merge each worker branch back and call
    `cleanup_worker_worktree` in that same turn.
  - Spawn all workers for the phase in one turn — their completion
    notifications batch into a single wakeup.
