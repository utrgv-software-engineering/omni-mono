# omni-code's shipped model catalog, declared in project.yml as
# `paths.model_catalog`. The framework parses it at product bootstrap
# (`import omni_code`) and installs a ModelConfigStore over it with the
# conventional hooks (config dir from the product identity, auth-gated
# platform model governance, codex OAuth discovery for the openai-oauth
# provider, platform credential vending). Users add their own
# providers/models via ~/.config/omni_code/models.json, which merges
# over (and can override) these defaults.
#
# Schema: omniagents.core.models.catalog (providers / default_model /
# default_provider — provider and model entries are the exact shape the
# store's models.json providers use; ${VAR} expands at resolve time).

# Default model to use if user hasn't set one.
default_model: gpt-5.1

# Provider profile implied by unprefixed model refs ("gpt-5.1");
# other providers use "<provider_name>/<model_name>".
default_provider: openai

# Model settings for OpenAI reasoning models (GPT-5.x). When store=false
# (the default for privacy), reasoning models require
# include: ["reasoning.encrypted_content"] to maintain reasoning context.
# See: https://github.com/openai/openai-agents-python/issues/2265
providers:
  openai:
    type: openai
    api_key: ${OPENAI_API_KEY}
    models:
      gpt-5.1:
        model: gpt-5.1
        label: GPT-5.1
        max_input_tokens: 272000
        max_output_tokens: 128000
        model_settings: &reasoning_model_settings
          store: false
          extra_body:
            include: ["reasoning.encrypted_content"]
      gpt-5.1-codex:
        model: gpt-5.1-codex
        label: GPT-5.1 Codex
        max_input_tokens: 272000
        max_output_tokens: 128000
        model_settings: *reasoning_model_settings
      gpt-5.2:
        model: gpt-5.2
        label: GPT-5.2
        max_input_tokens: 272000
        max_output_tokens: 128000
        model_settings: *reasoning_model_settings
      gpt-realtime:
        model: gpt-realtime
        label: GPT Realtime
        realtime: true

  # ChatGPT subscription via the Codex backend (OAuth). No API key — auth
  # is a ChatGPT login managed by omniagents.core.providers.codex. Talks
  # the Responses API to chatgpt.com/backend-api/codex. When signed in,
  # the model list is discovered live from the backend (the store's OAuth
  # discovery hook); the entries below are only the offline fallback.
  codex:
    type: openai-oauth
    models:
      gpt-5.2:
        model: gpt-5.2
        label: GPT-5.2 (ChatGPT)
        max_input_tokens: 272000
        max_output_tokens: 128000
        model_settings: *reasoning_model_settings
