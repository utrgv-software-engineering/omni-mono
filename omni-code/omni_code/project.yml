name: omni_code
allow_user_mcp_servers: true
allow_user_models: true
# Product identity — the single declaration of who this product is.
# Installed process-wide by omni_code.identity (bootstrap_product) and
# read by every framework subsystem default: CLI prog rendering, the
# per-user config dir, the platform policy slug + credential store, the
# codex token store, the self-updater, and sandbox-profile user layers.
product:
  name: omni-code
  prog: omni
  label: Omni Code
  slug: omni_code
  config_dir: omni_code
  windows_config_dir: OmniCode
  env_prefix: OMNI_CODE
  update:
    index_url: https://pypi.fury.io/ericmichael/omni-code/
    command_hint: omni update
# CLI surface — dispatched entirely by the framework's product CLI host
# (omniagents.product_cli.product_main). Reserved commands (model,
# provider, auth, update, sessions, serve, sandbox-host, describe) mount
# from convention + the product identity above — serve/sandbox-host are
# the framework's launcher-contract defaults (omniagents.product_serve),
# which pick up the packaged sandbox_profile_default.yml sibling of this
# file; sessions runs the conventionally-named session_summarizer agent
# with the summary envelope declared below; the models bootstrap wizard
# and embedded (launcher) mode are framework fallthrough conventions
# too. The one omni-code-specific behavior left — the governance
# preflight — lives in the extensions module.
cli:
  default_mode: ink
  extensions: omni_code.cli_extensions
# Sessions conventions (framework sessions CLI). The coding-flavored
# summary envelope: content keys ensured on every `omni sessions
# summarize` result, must agree with the JSON schema in
# agents/session_summarizer/instructions.md (that agent, named by
# convention, IS the summarizer — see
# omniagents.core.session.summarize).
sessions:
  summary_envelope:
    summary: ""
    decisions: []
    constraints: []
    key_files: []
    commands: []
    tests: []
    open_questions: []
    next_steps: []
    notable_errors: []
# Paths are relative to this file. Code/data siblings live inside the
# omni_code package (identical layout for editable and wheel installs);
# evaluations and target are repo-only and absent from wheels (the
# loader tolerates missing dirs).
paths:
  agents: agents
  tools: tools
  server_functions: server_functions
  capabilities: capabilities
  # The shipped provider/model catalog (data only). The framework builds
  # + installs the process-wide ModelConfigStore from it at product
  # bootstrap, with the conventional hooks — see
  # omniagents.core.models.catalog.
  model_catalog: models.yml
  evaluations: ../evaluations
  target: ../target
agents:
  entrypoint: omni
  voice_entrypoint: voice_agent

settings:
  - key: model_name
    label: Model Name
    group: OpenAI API
    default: gpt-5.2
    hint: "Model to use (e.g., gpt-5.2, gpt-4o)"

tracing:
  provider: studio
  project: omni_code
  name: omni_code
  settings:
    resume: never
