name: omni_code
allow_user_mcp_servers: true
allow_user_models: true
paths:
  agents: ../omni_agents
  tools: ../tools
  server_functions: ../server_functions
  target: ../target
agents:
  entrypoint: omni
  voice_entrypoint: voice_agent

settings:
  - key: model_name
    label: Model Name
    group: OpenAI API
    default: gpt-5
    hint: "Model to use (e.g., gpt-5, gpt-4o)"

# Network isolation proxy (disabled by default).
# When enabled, routes all outbound traffic through a local proxy
# that enforces the domain allowlist. No root/admin required.
# Override at runtime with OMNI_NETWORK_ALLOWLIST env var (comma-separated).
network:
  enabled: false
  allowlist: []
  denylist: []
  allow_private_ips: false
  enable_socks5: true

tracing:
  provider: studio
  project: omni_code
  name: omni_code
  settings:
    resume: never
