version: 1

# Built-in default sandbox profile shipped with omni-code.
#
# Resolution: this is the lowest layer. The launcher overrides it via
# ~/.config/omni_code/sandbox/default.yml (user-default) and
# ~/.config/omni_code/projects/<projectId>/sandbox.yml (per-project).
# CLI `--profile <path>` is an explicit override above all of those.

client:
  type: unix_local

manifest:
  # ${workspace_dir} is replaced with `omni serve --workspace <dir>` before
  # the profile is handed to the SDK. unix_local treats this as the sandbox
  # root in-place, so the agent edits the user's files directly.
  root: ${workspace_dir}

# No services and no exposed ports by default — pure agent + workspace.
# Dev environments (code-server, VNC, etc.) are the launcher's concern.

# Defaults for the launcher's Terminal app. Under unix_local the
# SessionPtyBackend invokes this command on the host (the SDK's
# pty_exec_start spawns a child process of `omni serve`), so this is
# effectively a host shell — equivalent to the legacy node-pty path.
terminal:
  command: "bash -i"
