version: 1

# Built-in default sandbox profile shipped with omni-code.
#
# This is the "host" execution target — NO sandbox. omni-code runs the agent
# as a plain Agent against the host filesystem and shell directly. It is the
# only target that works on every platform (Windows included); unix_local,
# docker, etc. are sandboxed targets the user/launcher selects explicitly.
#
# There is deliberately no knob for "host but fenced". The host target's shell
# reaches the whole machine, so fencing its file tools to ${workspace_dir}
# contained nothing — it only made `cat /etc/hosts` and `read_text` disagree
# about what exists. Choose a sandboxed target to be contained, or host to not
# be. (An earlier `confine:` key here declared exactly that middle tier and was
# never read by anything; it is gone rather than promoted to a real option.)
#
# Resolution: this is the lowest layer. The launcher overrides it via
# ~/.config/omni_code/sandbox/default.yml (user-default) and
# ~/.config/omni_code/projects/<projectId>/sandbox.yml (per-project).
# CLI `--profile <path>` is an explicit override above all of those.
# Sandboxing is the launcher's concern; standalone omni-code is unsandboxed.

client:
  type: host

manifest:
  # ${workspace_dir} is replaced with the Workspace directory selected during
  # environment materialization. Under the host target this is the agent's
  # working directory — relative paths resolve here, and that is all it is.
  # It is not a security boundary: the file tools may name anything on the
  # machine, exactly as the shell may.
  root: ${workspace_dir}

# Defaults for the launcher's Terminal app. Under the host target the shell
# runs as a child of `omni serve` on the host (HostPtyBackend) — a plain host
# shell, same as the agent's bash tool.
terminal:
  command: "bash -i"
