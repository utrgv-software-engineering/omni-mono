[project]
name = "omni-code"
version = "0.6.18"
description = "Omni Code: a full‑stack coding agent built with OmniAgents"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "omniagents[all]==0.7.23",
    "python-dotenv",
    "markitdown[all,docx,pdf]>=0.1.1",
    "litellm>=1.0.0",  # For non-OpenAI model support
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
pythonpath = ["."]
addopts = "-q"

[dependency-groups]
dev = [
    "pytest>=8.3.2",
    "pytest-asyncio>=1.0",
    "setuptools",  # tests/test_packaging.py imports setuptools
    "pip",  # tests/test_packaging.py shells out to `python -m pip wheel`
]

[project.scripts]
# Console scripts are the framework's generic product entries; they find
# omni-code's packaged project.yml through the entry-point declaration
# below — no product-side dispatcher module.
omni = "omniagents.product_cli:main"
omni-setup = "omniagents.product_cli:setup_main"

[project.entry-points."omniagents.products"]
# Product discovery: the value is the importable package whose packaged
# project.yml (with its `product:` section) declares who omni-code is.
# This is how bare `import omniagents` usage resolves omni-code identity
# with no bootstrap import.
omni-code = "omni_code"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main"]
include-package-data = true

[tool.setuptools.packages.find]
include = [
    "omni_code*",
]
exclude = [
    "tests*",
    "evaluations*",
]

[tool.setuptools.package-data]
# Everything ships inside the omni_code package: the project manifest,
# agent specs/instructions, capability YAMLs, and the default
# sandbox profile.
"omni_code" = [
    "project.yml",
    # The declared model catalog (paths.model_catalog) — the store is
    # built from this file at product bootstrap, so it must ship.
    "models.yml",
    "sandbox_profile_default.yml",
    # Optional wheel-shipped omni-sandbox binary (built in the standalone
    # omni-sandbox repo); governance.find_sandbox_binary checks here.
    "assets/bin/*",
    "agents/*/*.yml",
    # Also matches agents/_shared/*.md — the {% include %} fragment files
    # shared by the omni and voice_agent instruction templates.
    "agents/*/*.md",
    # Prompt-template files (paths.prompts) — goal_initial.md,
    # goal_tick.md, loop.md; resolved by convention at runtime
    # (omniagents.core.project.prompts), so they must ship.
    "prompts/*.md",
    "capabilities/*.yml",
]
"omni_agents.omni" = ["*.yml", "*.md"]
"omni_agents.voice_agent" = ["*.yml", "*.md"]
"omni_agents.init_agent" = ["*.yml", "*.md"]
