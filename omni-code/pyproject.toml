[project]
name = "omni-code"
version = "0.6.2"
description = "Omni Code: a full‑stack coding agent built with OmniAgents"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "omniagents[all]>=0.7.4",
    "python-dotenv",
    "markitdown[all,docx,pdf]>=0.1.1",
    "litellm>=1.0.0",  # For non-OpenAI model support
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
pythonpath = ["."]
addopts = "-q"

[dependency-groups]
dev = [
    "pytest>=8.3.2",
]

[project.scripts]
omni = "omni_code.cli:cli_main"
omni-setup = "omni_code.model_cli:setup_entrypoint"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main"]
include-package-data = true
packages = [
    "tools",
    "server_functions",
    "capabilities",
    "omni_code",
    "omni_agents",
    "omni_agents.omni",
    "omni_agents.voice_agent",
    "omni_agents.init_agent",
]

[tool.setuptools.package-data]
"omni_code" = [
    "project.yml",
    "sandbox/*",
]
# Capability definitions are data-only YAML; ship them at the package root
# (site-packages/capabilities/) so the packaged project.yml's
# `paths.capabilities: ../capabilities` resolves in a wheel install.
"capabilities" = ["*.yml"]
"omni_agents" = ["*/*.yml", "*/*.md"]
"omni_agents.omni" = ["*.yml", "*.md"]
"omni_agents.voice_agent" = ["*.yml", "*.md"]
"omni_agents.init_agent" = ["*.yml", "*.md"]
