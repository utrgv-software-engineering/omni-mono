[project]
name = "omni-code"
version = "0.6.17"
description = "Omni Code: a full‑stack coding agent built with OmniAgents"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "omniagents[all]==0.7.20",
    "python-dotenv",
    "markitdown[all,docx,pdf]>=0.1.1",
    "litellm>=1.0.0",  # For non-OpenAI model support
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
pythonpath = ["."]
addopts = "-q"

[dependency-groups]
dev = [
    "pytest>=8.3.2",
    "pytest-asyncio>=1.0",
    "setuptools",  # tests/test_packaging.py imports setuptools
    "pip",  # tests/test_packaging.py shells out to `python -m pip wheel`
]

[project.scripts]
omni = "omni_code.cli:cli_main"
omni-setup = "omni_code.model_cli:setup_entrypoint"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main"]
include-package-data = true

[tool.setuptools.packages.find]
include = [
    "omni_code*",
]
exclude = [
    "tests*",
    "evaluations*",
]

[tool.setuptools.package-data]
# Everything ships inside the omni_code package: the project manifest,
# agent specs/instructions, capability YAMLs, overlays, and the sandbox
# assets + default profile.
"omni_code" = [
    "project.yml",
    "sandbox_profile_default.yml",
    "sandbox/*",
    "agents/*/*.yml",
    # Also matches agents/_shared/*.md — the {% include %} fragment files
    # shared by the omni and voice_agent instruction templates.
    "agents/*/*.md",
    "capabilities/*.yml",
    "overlays/*.yml",
]
"omni_agents.omni" = ["*.yml", "*.md"]
"omni_agents.voice_agent" = ["*.yml", "*.md"]
"omni_agents.init_agent" = ["*.yml", "*.md"]
