[project]
name = "omni-code"
version = "0.4.0"
description = "Omni Code: a full‑stack coding agent built with OmniAgents"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=2.2",
    # openai-agents and python-dotenv are required transitively by omniagents
    "omniagents[all]>=0.3.30",
    "markitdown[all,docx,pdf]>=0.1.1",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "pygit2>=1.13.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
pythonpath = ["."]
addopts = "-q"

[dependency-groups]
dev = [
    "pytest>=8.3.2",
]

[project.scripts]
omni = "main:cli_main"
omni-setup = "omni_code.setup_cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main"]
packages = [
    "tools",
    "server_functions",
    "omni_code",
    "omni_agents",
    "omni_agents.coding_agent",
    "omni_agents.voice_agent",
    "omni_agents.init_agent",
]

[tool.setuptools.package-data]
"omni_agents.coding_agent" = ["*.yml", "*.md"]
"omni_agents.voice_agent" = ["*.yml", "*.md"]
"omni_agents.init_agent" = ["*.yml", "*.md"]
"*" = ["project.yml"]
