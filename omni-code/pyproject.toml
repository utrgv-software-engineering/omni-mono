[project]
name = "omni-code"
version = "0.1.4"
description = "Omni Code: a full‑stack coding agent built with OmniAgents"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai==1.99.9",
    # openai-agents and python-dotenv are required transitively by omniagents
    "omniagents[all]==0.3.13",
    "markitdown[all,docx,pdf]>=0.1.1",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "pygit2>=1.13.0",
    "agentio==0.1.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
pythonpath = ["."]
addopts = "-q"

[dependency-groups]
dev = [
    "pytest>=8.3.2",
]

[project.scripts]
omni = "main:cli_main"
omni-setup = "omni_code.setup_cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main"]
packages = ["tools", "oagents", "oagents.instructions", "server_functions", "omni_code"]

[tool.setuptools.package-data]
oagents = ["instructions/*.md"]
