name: Publish to Gemfury

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build
      - name: Build package (Studio + Ink assets)
        run: make package-build
      - name: Publish to Gemfury
        env:
          FURY_USER: ${{ secrets.FURY_USER }}
          FURY_TOKEN: ${{ secrets.FURY_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${FURY_USER:-}" ] || [ -z "${FURY_TOKEN:-}" ]; then
            echo "FURY_USER and FURY_TOKEN secrets must be set"
            exit 1
          fi
          for file in dist/*; do
            if [ -f "$file" ]; then
              echo "Uploading $file to Gemfury"
              curl -f -sS -F package=@"$file" "https://${FURY_TOKEN}@push.fury.io/${FURY_USER}/"
            fi
          done
          if ls dist/* >/dev/null 2>&1; then
            echo "Upload complete"
          else
            echo "No distribution files found"
            exit 1
          fi
