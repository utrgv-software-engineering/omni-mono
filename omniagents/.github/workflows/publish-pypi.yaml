name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  intel-macos-wheel:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: python -m pip install build
      - run: make package-build
      - run: "python -m pip install --no-deps --only-binary=:all: dist/*.whl"
      - run: python -I -c "from omniagents import _quickjs; assert _quickjs.Context().eval('40+2') == 42"
      - uses: actions/upload-artifact@v4
        with:
          name: intel-macos-dist
          path: dist/*.whl
  build-and-publish:
    needs: intel-macos-wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine
      - name: Build package (Studio + Ink assets)
        run: make package-build
      - uses: actions/download-artifact@v4
        with:
          name: intel-macos-dist
          path: dist
      - name: Check package
        run: twine check dist/*
      - name: Publish to Test PyPI
        if: github.event_name == 'workflow_dispatch'
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.TEST_PYPI_API_TOKEN }}
        run: twine upload --repository testpypi dist/*
      - name: Publish to PyPI
        if: github.event_name == 'release'
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: twine upload dist/*
