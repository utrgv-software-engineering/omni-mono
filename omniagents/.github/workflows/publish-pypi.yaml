name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-binaries:
    name: Build omni-tui binary (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            goos: linux
            goarch: amd64
            target: x86_64-unknown-linux-gnu
            binary: omni-tui
            archive: tar.gz
          - runner: ubuntu-latest
            goos: linux
            goarch: arm64
            target: aarch64-unknown-linux-gnu
            binary: omni-tui
            archive: tar.gz
          - runner: macos-14
            goos: darwin
            goarch: arm64
            target: aarch64-apple-darwin
            binary: omni-tui
            archive: tar.gz
          - runner: macos-14
            goos: darwin
            goarch: amd64
            target: x86_64-apple-darwin
            binary: omni-tui
            archive: tar.gz
          - runner: windows-latest
            goos: windows
            goarch: amd64
            target: x86_64-pc-windows-msvc
            binary: omni-tui.exe
            archive: zip
          - runner: windows-latest
            goos: windows
            goarch: arm64
            target: aarch64-pc-windows-msvc
            binary: omni-tui.exe
            archive: zip
    defaults:
      run:
        shell: bash
        working-directory: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.4'
      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p build/${{ matrix.target }}
          CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o build/${{ matrix.target }}/${{ matrix.binary }} ./omniagents/backends/bubbletea/cmd/omni-tui
      - name: Package archive
        env:
          TARGET: ${{ matrix.target }}
          BINARY_NAME: ${{ matrix.binary }}
          ARCHIVE_EXT: ${{ matrix.archive }}
        run: |
          python - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          import tarfile
          import zipfile

          target = os.environ["TARGET"]
          binary_name = os.environ["BINARY_NAME"]
          archive_ext = os.environ["ARCHIVE_EXT"]

          root = Path("build") / target
          binary = root / binary_name

          if archive_ext == "tar.gz":
              archive = root / f"omni-tui-{target}.tar.gz"
              with tarfile.open(archive, "w:gz") as tf:
                  tf.add(binary, arcname=binary_name)
          elif archive_ext == "zip":
              archive = root / f"omni-tui-{target}.zip"
              with zipfile.ZipFile(archive, "w", compression=zipfile.ZIP_DEFLATED) as zf:
                  zf.write(binary, arcname=binary_name)
          else:
              raise SystemExit("unknown archive extension")

          digest = hashlib.sha256()
          with open(archive, "rb") as handle:
              while True:
                  chunk = handle.read(1024 * 1024)
                  if not chunk:
                      break
                  digest.update(chunk)
          checksum = archive.with_name(archive.name + ".sha256")
          checksum.write_text(digest.hexdigest() + "\n", encoding="utf-8")
          PY
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            build/${{ matrix.target }}/omni-tui-${{ matrix.target }}*

  build-and-publish:
    needs: build-binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Download omni-tui binaries
        uses: actions/download-artifact@v4
        with:
          path: stage
      - name: Stage vendor binaries
        run: python scripts/stage_tui_vendor.py --artifacts stage --vendor omniagents/backends/bubbletea/vendor --clear
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine
      - name: Build package (Studio + Ink assets)
        run: make package-build
      - name: Check package
        run: twine check dist/*
      - name: Publish to Test PyPI
        if: github.event_name == 'workflow_dispatch'
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.TEST_PYPI_API_TOKEN }}
        run: twine upload --repository testpypi dist/*
      - name: Publish to PyPI
        if: github.event_name == 'release'
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: twine upload dist/*
