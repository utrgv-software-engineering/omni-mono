name: Python Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        # sandbox-docker: serve_harness's 3-tier docker resume path imports
        # the docker SDK (no daemon needed — tests use fakes).
        # sandbox-aci: the lifecycle-session mixin invariant covers
        # AciSandboxClient, and the aci unit suites unskip with it.
        # sandbox-bashkit: browser-sandbox contract and snapshot security
        # tests must execute rather than disappearing behind importorskip.
        run: python -m pip install '.[dev,server,sandbox-docker,sandbox-bashkit,sandbox-aci]'
      - name: Install web dependencies
        working-directory: omniagents/studio/server/web
        run: npm ci
      - name: Install ink dependencies
        working-directory: omniagents/backends/ink/tui
        run: npm ci
      - name: Install web UI dependencies
        working-directory: omniagents/backends/web/ui
        run: npm ci
      - name: Lint web UI
        working-directory: omniagents/backends/web/ui
        run: npm run lint
      - name: Run coverage suite
        env:
          # Promotes a missing Bashkit dependency from a local-friendly skip
          # to a collection failure. CI must never pass without this suite.
          OMNIAGENTS_REQUIRE_BASHKIT: '1'
        run: ./scripts/run_coverage.sh
      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            coverage/python/coverage.xml
            coverage/web/lcov.info
            coverage/ink/lcov.info

  # The launcher runs this runtime natively on Windows (a venv under
  # %USERPROFILE%\.omni), so the Python suite must pass there too. Same
  # interpreter and extras the launcher installs (omni-code -> omniagents[all]).
  test-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      # The desktop launcher runs the runtime in Python UTF-8 mode; test the
      # same configuration students get.
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: python -m pip install ".[all,dev]"
      - name: Install web UI dependencies
        working-directory: omniagents/backends/web/ui
        run: npm ci
      - name: Install ink dependencies
        working-directory: omniagents/backends/ink/tui
        run: npm ci
      - name: Run Python tests
        # Shell-heavy tests that hang on Windows fail fast instead of
        # eating the job timeout.
        run: pytest -n auto --dist loadfile -p no:cacheprovider --timeout 60

  # The sandbox-substrate suites (tkt_k5Yk_JBkrIw6). Both modules skip unless
  # the image is already present locally, and nothing pulled it, so neither had
  # ever executed in CI — while every defect they were written for (absolute
  # FileEntry paths, an unconfined SandboxWorkspace.resolve, `size: null` from
  # fs_stat, a bound-method `is_dir`) was invisible to the host-only suites the
  # `test` job does run.
  #
  # Its own job because the container work is wall-clock, not CPU: pulling
  # alpine/git plus 31 tests that each create and delete a container.
  # Measured: 1m42s for the whole job on ubuntu-latest (66s of it pytest);
  # ~53s for the two modules locally on a warm image. The 15-minute timeout
  # is a hang guard, not a budget.
  # GitHub-hosted ubuntu-latest ships a running Docker daemon; a self-hosted
  # runner must provide one, and the REQUIRE env var below makes its absence a
  # red build rather than a silent all-skip.
  sandbox-substrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify the runner has a Docker daemon
        run: docker version
      - name: Pull the sandbox image
        run: docker pull alpine/git:latest
      - name: Install dependencies
        run: python -m pip install '.[dev,server,sandbox-docker]'
      - name: Run the sandbox-substrate suites
        # OMNIAGENTS_REQUIRE_SANDBOX_IMAGE turns the modules' local skipif into
        # a collection error, so this job cannot pass by skipping everything.
        env:
          OMNIAGENTS_REQUIRE_SANDBOX_IMAGE: '1'
        run: |
          pytest -v \
            tests/integration/test_git_sandbox_substrate.py \
            tests/integration/test_fs_sandbox_substrate.py
