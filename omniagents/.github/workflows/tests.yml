name: Python Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Install dependencies
        run: python -m pip install '.[dev,server]'
      - name: Install web dependencies
        working-directory: omniagents/studio/server/web
        run: npm ci
      - name: Run coverage suite
        run: ./scripts/run_coverage.sh
      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            coverage/python/coverage.xml
            coverage/web/lcov.info
            coverage/go/cover.out
