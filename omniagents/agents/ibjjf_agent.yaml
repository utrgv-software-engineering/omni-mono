# Configuration for the IBJJF Assistant Agent

# --- Basic Info ---
name: IBJJF Assistant
# header_title: IBJJF Assistant # Derived from name
# page_title: IBJJF Assistant   # Derived from name
model: gpt-4o # Or specify another model like gpt-3.5-turbo

# --- Instructions ---
# Load from file is preferred for longer instructions
instructions_file: instructions/ibjjf_instructions.md # Path relative to this YAML file
# instructions: | # Alternatively, define inline (less common for long text)
#   You are an assistant for IBJJF competitors...

# --- Tools ---
tools: # List of function names to activate for this agent
  - geocode
  - get_weather
  - web_search
  - youtube_search
  - google_flights_search
  - ibjjf_events
  - ibjjf_brackets
  - ibjjf_competitors

# --- Agent Safety ---
# Defaults to True, explicitly set to False for this example
use_safe_agent: false
# safe_agent_options: # Only needed if use_safe_agent is true and defaults aren't suitable
#   skip_approvals: false
#   halt_on_rejection: true
#   safe_tool_names: []
#   safe_tool_patterns: []

# --- MCP ---
# This agent does not use MCP
uses_mcp: false

# --- UI/UX ---
welcome_text: "👋 Hi! I'm the IBJJF Assistant. Ask me about upcoming tournaments, specific event divisions, or competitors. You can also ask me about weather, flights, or general web search."
theme_color: ft.Colors.BLUE_900 # Can use Flet color constants as strings
debug: false # Set to true to enable debug mode features (like tool output display)
# page_title_suffix: " (Debug Mode)" # Added automatically if debug: true
icon_map:
  geocode: ft.Icons.MAP
  get_weather: ft.Icons.CLOUD
  web_search: ft.Icons.SEARCH
  youtube_search: ft.Icons.VIDEO_LIBRARY
  google_flights_search: ft.Icons.FLIGHT
  ibjjf_events: ft.Icons.EVENT
  ibjjf_brackets: ft.Icons.LIST_ALT
  ibjjf_competitors: ft.Icons.PEOPLE

# --- Settings ---
# Define *additional* settings required by this agent's tools.
# Default OpenAI settings (api_key, base_url, model_name) are added automatically.
settings:
  - key: serpapi_api_key
    label: SerpApi API Key
    group: SerpApi
    secret: true
    hint: Required for web/YouTube/Flights search tools

# Optional Customizations (rarely needed for basic agents)
# header_controls_builder: null # Path to a function? (Complex)
# cleanup_handler: null 