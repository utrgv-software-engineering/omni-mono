name: IBJJF Assistant (Remote)
# This configuration connects to a remote OmniAgents server instead of
# building the agent locally.  Point `ws_url` at your running server
# and (optionally) set the env-var specified in `auth_token_env` with
# the bearer token the server expects.
remote_agent:
  ws_url: "ws://localhost:8000/ws"
  auth_token_env: "IBJJF_SERVER_TOKEN"  # set this env var before running if the server requires a token

# These tool names are only used for icon mapping in the UI; they won't
# execute locally when using remote mode.
icon_map:
  geocode: ft.Icons.MAP
  get_weather: ft.Icons.CLOUD
  web_search: ft.Icons.SEARCH
  youtube_search: ft.Icons.VIDEO_LIBRARY
  google_flights_search: ft.Icons.FLIGHT
  ibjjf_events: ft.Icons.EVENT
  ibjjf_brackets: ft.Icons.LIST_ALT
  ibjjf_competitors: ft.Icons.PEOPLE

theme_color: ft.Colors.BLUE_900 