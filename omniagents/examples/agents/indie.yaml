name: Indie
welcome_text: "👋 Welcome to 80/20 Jiu-Jitsu! I'm Indie, your gym assistant. How can I assist you today?"
client_storage_prefix: mcp_flet_agent.

instructions_file: ,,/instructions/indie.md
tools: []
model_name: gpt-4o

use_safe_agent: true
safe_agent_options:
  skip_approvals: false
  halt_on_rejection: true
  safe_tool_names: []
  safe_tool_patterns: []

uses_mcp: true

settings:
  - key: openai_api_base
    label: OpenAI API Base URL
    group: OpenAI API
    default: "https://api.openai.com/v1"
    hint: "e.g., https://api.openai.com/v1"
  - key: openai_api_key
    label: OpenAI API Key
    group: OpenAI API
    secret: true
    hint: "Required"
  - key: model_name
    label: Model Name
    group: OpenAI API
    default: "gpt-4o"
    hint: "e.g., gpt-4o, gpt-3.5-turbo"
  - key: mcp_url
    label: MCP Server URL
    group: MCP Server
    default: ""
    hint: "e.g., http://localhost:3000/mcp/sse"
  - key: mcp_auth_token
    label: MCP Auth Token
    group: MCP Server
    secret: true
    hint: "Optional, if MCP server requires auth"

debug: false
theme_color: "ft.Colors.INDIGO_700"
