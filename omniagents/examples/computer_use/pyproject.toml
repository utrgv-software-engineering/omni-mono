[project]
name = "computer_use"
version = "0.1.0"
description = "Agent project built with OmniAgents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai==1.99.9",
    "omniagents[all]==0.3.23",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "pygit2>=1.13.0",
    "pyautogui>=0.9",
]

[project.optional-dependencies]
dev = [
    "black>=24.0",
    "pytest>=8.3.2",
    "build>=1.2.1",
    "twine>=5.1.1",
    "bump2version>=1.0.1",
]

[project.scripts]
computer_use = "computer_use.cli:main"
computer_use-setup = "computer_use.setup:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["computer_use", "computer_use.*", "tools", "tools.*"]

[tool.black]
line-length = 88
target-version = ["py311"]
include = '\\.(py|pyi)$'
exclude = '''
/(\n    \\.git\n  | \\.mypy_cache\n  | \\.venv\n  | build\n  | dist\n)/
'''

[tool.bumpversion]
current_version = "0.1.0"
commit = true
tag = true
parse = '(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)'
serialize = ['{major}.{minor}.{patch}']

[tool.bumpversion."file:pyproject.toml"]
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'
