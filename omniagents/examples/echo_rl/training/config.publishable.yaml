# Smallest setup that, run to completion across seeds, yields a defensible
# ECHO-vs-GRPO result. This is a single-model ablation (not the paper's 3-model
# sweep). Run it with experiments/run.py --config training/config.publishable.yaml
# --seeds 0,1,2  (runs the matched baseline and ECHO arms for each seed), then
# evaluate held-out + OOD with experiments/evaluate.py and aggregate/test
# significance with experiments/analyze.py. See EXPERIMENT.md.
#
# Compute: one ~8B model fits on a single 80GB GPU at this batch size; the full
# matrix (2 arms x 3 seeds) is ~1-3 GPU-days. NOT a laptop run.

model: Qwen/Qwen3-8B            # ~8B is the practical floor; <7B emits too few
                                # successful tool calls for GRPO to get signal.
default_image: python:3.11-slim

dataset:
  source: openthoughts          # the public ~720-task lineage (real scale)
  split: train
  limit: null

grpo:
  num_train_epochs: 1
  per_device_batch_size: 8
  gradient_accumulation_steps: 1
  num_generations: 8            # GRPO advantage needs intra-group contrast; >=8
  max_completion_length: 2048
  temperature: 0.8
  learning_rate: 1.0e-6
  max_grad_norm: 0.2
  max_tool_calling_iterations: 16

echo:
  world_model_coeff: 0.05       # run.py also runs the matched 0.0 baseline arm
  world_loss_normalization: selected_tokens

runtime:
  exec_timeout: 30.0
  verifier_timeout: 120.0

# ~400-500 GRPO steps is where ECHO's separation from the baseline is clear.
# (HF Trainer counts steps from epochs x dataset size / effective batch; set
# num_train_epochs so steps land in that range for your task count, or use
# max_steps via a custom GRPOConfig.)
seed: 0
output_dir: results/publishable
report_to: wandb                # log curves for the paper
logging_steps: 5
save_model: true
