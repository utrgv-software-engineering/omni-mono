[project]
name = "mcp_agent"
version = "0.1.0"
description = "Agent project built with OmniAgents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "omniagents[all]==0.3.21",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "black>=24.0",
    "pytest>=8.3.2",
    "build>=1.2.1",
    "twine>=5.1.1",
    "bump2version>=1.0.1",
]

[project.scripts]
mcp_agent = "mcp_agent.cli:main"
mcp_agent-setup = "mcp_agent.setup:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mcp_agent", "mcp_agent.*", "tools", "tools.*"]

[tool.black]
line-length = 88
target-version = ["py311"]
include = '\\.(py|pyi)$'
exclude = '''
/(\n    \\.git\n  | \\.mypy_cache\n  | \\.venv\n  | build\n  | dist\n)/
'''

[tool.bumpversion]
current_version = "0.1.0"
commit = true
tag = true
parse = '(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)'
serialize = ['{major}.{minor}.{patch}']

[tool.bumpversion."file:pyproject.toml"]
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'
