[project]
name = "demo-mcp-server"
version = "0.1.0"
description = "Demo MCP server for OmniAgents example"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.0",
    "httpx>=0.27.0",
]

[project.scripts]
demo_mcp_server = "demo_mcp_server.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["demo_mcp_server", "demo_mcp_server.*"]

