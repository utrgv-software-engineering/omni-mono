# Realtime Voice Agent Example
# This agent demonstrates voice interaction capabilities using OpenAI's realtime API

name: "voice_weather"
header_title: "Voice Weather Assistant"
page_title: "Voice Weather"
welcome_text: "Start speaking to ask about the weather!"
client_storage_prefix: "voice_weather"
project_slug: "examples"
agent_slug: "voice_weather"

# Model configuration
model_name: "gpt-realtime"

# Enable realtime mode
realtime_mode: true

# Realtime-specific settings
realtime_settings:
  model_name: "gpt-realtime"
  voice: "alloy"  # Options: alloy, echo, fable, onyx, nova, shimmer
  temperature: 0.8
  max_output_tokens: 4096

  # Communication modalities
  # Note: OpenAI realtime API supports EITHER 'text' OR 'audio', not both
  # Use 'text' for text-only testing, 'audio' for full voice interaction
  modalities:
    - audio

  # Audio format configuration
  input_audio_format: "pcm16"   # 16-bit PCM, 24kHz
  output_audio_format: "pcm16"  # 16-bit PCM, 24kHz

  # Voice activity detection
  # Configured for push-to-talk mode (quick response when you stop speaking)
  turn_detection:
    type: "server_vad"
    threshold: 0.3      # Lower = more sensitive
    prefix_padding_ms: 100     # Minimal padding
    silence_duration_ms: 200   # Very short silence triggers response (200ms)

  # Input transcription (optional)
  input_audio_transcription:
    model: "whisper-1"

# Agent instructions
instructions: |
  You are a friendly, flexible voice assistant.

  Your role is to:
  - Help with weather questions, forecasts, and related suggestions
  - Guide users through computer tasks and troubleshooting
  - Execute available tools, including bash commands, when helpful and safe
  - Explain each step clearly while keeping the conversation natural
  - Collaborate via shared terminals by preparing tmux sessions when needed

  Guidelines:
  - Confirm before running actions that modify the system
  - Keep responses concise and easy to follow in voice form
  - Ask clarifying questions when information is missing or ambiguous
  - Highlight important cautions or noteworthy results
  - Stay personable and supportive throughout the interaction
  - For collaborative shell work, create a named tmux session and share `tmux attach -t <session>` instructions with the user
  - When you need to review output, capture it with `tmux capture-pane -pt <session>`

# Tools
tools:
  - execute_bash
  - glob_files
  - grep_files
  - list_directory
  - read_file
  - write_file
  - apply_patch
  - download_file
  - web_fetch
  - web_search
  - youtube_search
  - scholar_search
  - get_current_weather
  - get_weather_forecast
  - get_weather_alerts
tools_directory: "tools"

# Optional: Settings that can be configured via environment or UI
settings:
  - key: "openai_api_key"
    label: "OpenAI API Key"
    type: "string"
    required: true
    secret: true
    description: "Your OpenAI API key for accessing the realtime API"
