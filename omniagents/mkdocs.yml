site_name: OmniAgents
site_description: A lightweight wrapper around OpenAI Agents with multiple interface modes
site_author: Eric Martinez
site_url: https://ericmartinez.github.io/omniagents/

repo_name: utrgv-software-engineering/omniagents
repo_url: https://github.com/utrgv-software-engineering/omniagents
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started:
    - Installation: getting-started/installation.md
    - Quick Start: getting-started/quickstart.md
    - Configuration: getting-started/configuration.md
  - User Guide:
    - Defining Agents: guide/defining-agents.md
    - Running Modes: guide/running-modes.md
    - Tools: guide/tools.md
    - Rich Tools: guide/rich-tools.md
    - Safe Agent Mode: guide/safe-agent.md
    - Session Management: guide/sessions.md
  - Backends:
    - Overview: backends/overview.md
    - Server: backends/server.md
  - Protocols:
    - Serve Protocol: serve-protocol.md
  - API Reference:
    - Core: api/core.md
    - Tools: api/tools.md
    - RPC Protocol: api/rpc-protocol.md
  - Examples: examples.md
  - Development:
    - Contributing: development/contributing.md
    - Testing: development/testing.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/utrgv-software-engineering/omniagents
