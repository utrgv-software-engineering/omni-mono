name: tokyonight
colors:
  primary:
    background: '#1a1b26'        # Dark navy background
    foreground: '#a9b1d6'        # Soft blue-gray text
  
  semantic:
    # Conversation colors - distinct but harmonious
    user_message: '#9099b2'      # Slightly muted foreground - user's input
    assistant_message: '#7aa2f7' # Soft blue - assistant's response (prominent)
    
    # Tool interaction colors - muted but informative  
    tool_name: '#7dcfff'         # Cyan - tool being called
    tool_result: '#565f89'       # Muted gray-blue - de-emphasized results
    
    # Status colors - clear meaning
    error: '#f7768e'             # Soft red - errors
    warning: '#e0af68'           # Warm yellow - warnings
    info: '#7dcfff'              # Sky blue - informational
    debug: '#444b6a'             # Dark gray - debug/low priority
  
  ui:
    # Interface structure - subtle and unobtrusive
    border: '#3b4261'            # Subtle borders
    selection: '#283457'         # Selected item background
    cursor: '#7aa2f7'            # Matches user input color
    header: '#7aa2f7'            # Headers match user color for consistency
    help: '#565f89'              # Muted help text
    
    # Input elements
    input_border: '#3b4261'      # Match border color
    input_text: '#c0caf5'        # Slightly brighter for active input
    input_prompt: '#bb9af7'       # Purple - primary action/CTA (matches user theme)
    message_prompt: '#bb9af7'     # Purple - message list indicator
    
    # Loading states
    spinner: '#9ece6a'           # Green - active processing/thinking
    
    # Session list
    session_title: '#a9b1d6'     # Default text
    session_subtitle: '#565f89'  # Muted subtitle
    
    # Approval dialog - uses warning colors for attention
    approval_title: '#e0af68'    # Warning yellow for attention
    approval_option: '#a9b1d6'   # Normal text for options
    approval_selected: '#7aa2f7' # User action color when selected