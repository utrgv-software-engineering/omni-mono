name: human
tools:
  - notify
  - escalate
instructions: |
  Two tools for talking to the human operator outside the normal
  conversation flow:

  - `notify(message="...")` — fire-and-forget heads-up. Run continues.
    Use for time-sensitive but non-blocking information: a long-running
    operation started, an anomaly the human should know about, partial
    results ready. Does NOT pause the agent.

  - `escalate(message="...")` — pause and ask for input. Use ONLY when
    truly blocked on something requiring human judgement: missing
    credentials, contradictory requirements you can't resolve from
    context, an external system that needs manual intervention.
    Returns the human's reply as the tool result. Prefer `notify` when
    the work can continue without input.
