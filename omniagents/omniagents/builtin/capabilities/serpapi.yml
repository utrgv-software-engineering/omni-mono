name: serpapi
tools:
  - web_search
  - youtube_search
  - scholar_search
instructions: |
  Search via SerpAPI (requires `SERPAPI_API_KEY`):
  - `web_search` for general queries.
  - `scholar_search` for academic sources.
  - `youtube_search` for video.
  Search results carry only snippets; fetch a hit's page to read it in full.
