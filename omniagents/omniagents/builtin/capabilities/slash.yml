name: slash
tools:
  - dispatch
server_functions:
  - help
instructions: |
  When the user's message begins with `/`, call `dispatch("<name>", args:
  "<rest>")` to execute the named slash command. Only call `dispatch` in
  direct response to a leading-slash message — never infer or auto-run a
  command from context.

  Forms:
  - `/foo`         → `dispatch("foo")`
  - `/foo bar baz` → `dispatch("foo", args: "bar baz")`
