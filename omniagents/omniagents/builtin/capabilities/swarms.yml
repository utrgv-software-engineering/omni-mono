name: swarms
tools:
  - dispatch_worker
  - get_worker
  - close_single_worker
  - cleanup_single_worker
  - create_swarm
  - add_swarm_member
  - dispatch_swarm_member
  - get_swarm
  - message_swarm_member
  - close_swarm
  - cleanup_swarm_member
server_functions:
  - workers.list
  - workers.kill
  - workers.resume
instructions: |
  Choose how to do the work before choosing a delegation tool:
  - Work directly by default. Keep work yourself when it needs continuous
    judgment, shared context, or clarification from the user, or when briefing
    and reviewing a worker would cost more than the assignment saves.
  - Use one standalone worker for a bounded assignment with a clear deliverable
    that benefits from isolation, specialized instructions, or independent review.
  - Use multiple standalone workers for assignments that can proceed independently.
    Standalone workers can run in parallel, but receive no dedicated tools for
    messaging one another. They report back to you; you coordinate dependencies
    and combine their results. Parallel execution alone does not require a swarm.
  - Use a swarm when distinct assignments are interdependent and members need to
    exchange findings or coordinate changes while working. Identify that concrete
    coordination need before creating the swarm. If everyone only needs to report
    back to you, prefer standalone workers.
  Task size or difficulty alone does not justify delegation or a swarm. Choose
  the smallest arrangement that helps and expand only when a concrete need appears.
  An approved plan is permission to advance its scope, not an instruction to spawn
  workers. You retain responsibility for the user's outcome, scope, acceptance
  criteria, review, integration, and final result. Delegation does not expand
  authorization or bypass tool approval rules.

  Standalone workers:
  - Use dispatch_worker with a short name, task, and optional role instructions.
    Give each independent assignment its own name. Include necessary context,
    inputs, boundaries, ownership, and acceptance criteria. Dispatch independent
    assignments in the same turn when useful.
  - Keep each assignment self-contained: standalone workers do not receive the
    swarm teammate-discovery or messaging tools. Shared files or other granted
    capabilities may still provide shared context; this is not an isolation
    guarantee. Route findings and dependencies through yourself.
  - Reuse a name to resume that worker's history; running workers cannot be
    dispatched again. Inspect with get_worker and cancel with close_single_worker.
  - Review and integrate results before cleanup_single_worker removes an isolated
    workspace. Completion notifications wake you automatically; do not poll to wait.

  Coordinated swarms:
  - Create a swarm with a concrete shared objective, then add a small roster
    of named members with distinct role instructions. Names identify work;
    fictional personalities are unnecessary.
  - Define all members before dispatching so they can discover the team.
    Dispatch self-contained assignments with inputs, boundaries, ownership,
    and acceptance criteria. Explain what findings or changes members need to
    coordinate and with whom. Dispatch independent work in the same turn.
  - Swarm members can run in parallel and communicate directly. Each receives
    swarm_member_message(recipient, message) to send findings or dependencies to
    a named teammate or "owner", and swarm_member_context() to read the shared
    objective, teammate roles/status, and its incoming/outgoing mailbox.
    Communication is scoped to that swarm. Encourage useful coordination, not
    acknowledgments or social chatter; the swarm has a message budget.
  - Members cannot recruit or manage teammates. You resolve disagreements and
    own integration and completion; review evidence rather than blindly accepting
    results or repeating every member's work.
  - Completion notifications arrive through the worker runtime. End your
    turn when waiting; do not poll. Use get_swarm to inspect results and
    messages when deciding the next step. Messages are retained in the mailbox,
    with live delivery attempted for started teammates. A message alone does not
    wake an idle recipient or the owner; use dispatch_swarm_member again to resume
    a finished member. As owner, use message_swarm_member for guidance and
    get_swarm to inspect team messages.
  - Review results and integrate changes before cleanup_swarm_member.
    Close the swarm with the final outcome. Closing retains workspaces;
    cleanup is explicit and prevents further dispatch of that member.
  - Swarm membership, roles, mailboxes and worker identities persist across runtime
    restarts. Inspect recovered workers before resuming; interrupted tool effects
    may be uncertain. Missing environments or unavailable recipes block resumption.
