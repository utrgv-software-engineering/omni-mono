name: workspace_info
# Control-plane only: filesystem-info RPCs for picker UIs. The web
# backend's workspace picker feature-detects `fs_list_dir` +
# `fs_get_workspace_root` (App.tsx) and calls `fs_get_home`
# (WorkspacePicker.tsx) — the names are a fixed RPC surface. Launchers
# with a sandboxed workspace install providers via
# omniagents.core.runtime.workspace_info (sources, manifest root,
# sandbox session); standalone servers fall back to the host filesystem.
server_functions:
  - fs_get_cwd
  - fs_get_workspace_root
  - fs_get_home
  - fs_list_dir
  - fs_get_sources
