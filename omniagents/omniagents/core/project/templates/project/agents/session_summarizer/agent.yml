name: session_summarizer
label: Session Summarizer
description: "Summarizes a past session for fast recall"
# This agent's name IS the install: the framework's session-summarize
# seam (`<prog> sessions summarize`) runs the project agent named
# `session_summarizer` one-shot under these instructions (bypassing
# AgentService, so no approvals run against it). instructions.md is the
# prompt; the JSON keys it emits must agree with project.yml's
# sessions.summary_envelope (absent one, the framework's neutral default
# envelope, which this starter prompt matches).
instructions_file: instructions.md

tools: []

# Headless subagent — empty tool list makes hangs impossible;
# use_safe_agent: false documents the intent and stays correct if this
# agent is ever moved onto AgentService.
use_safe_agent: false

model_settings:
  tool_choice: none

max_turns: 1

variables: {}
