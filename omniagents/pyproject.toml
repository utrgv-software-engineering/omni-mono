[project]
name = "omniagents"
dynamic = ["version"]
description = "OmniAgents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai-agents==0.2.7",
    "python-dotenv",
    "pydantic-core==2.33.0",
    "pydantic==2.11.1",
    "PyYAML",
    "Jinja2",
]

[project.scripts]
omniagents = "omniagents.cli:main"

[project.optional-dependencies]
cli = []  # CLI has no extra dependencies
flet = [
    "flet[all]==0.27.6",
]
gui = ["omniagents[flet]"]  # Alias for flet
server = [
    "fastapi[all]>=0.115.12",
    "uvicorn>=0.34.1",
]
all = ["omniagents[cli,flet,server]"]
dev = [
    "pytest",
    "bump2version",
]

[project.entry-points."omniagents.backends"]
cli = "omniagents.backends.cli:CLIBackend"
flet = "omniagents.backends.flet:FletBackend"
gui = "omniagents.backends.flet:FletBackend"
server = "omniagents.backends.server:ServerBackend"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["omniagents*"]

[tool.setuptools.dynamic]
version = {attr = "omniagents._version.__version__"}
