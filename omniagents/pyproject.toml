[project]
name = "omniagents"
dynamic = ["version"]
description = "OmniAgents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai-agents==0.4.2",
    "python-dotenv",
    "pydantic-core==2.41.4",
    "pydantic==2.12.3",
    "PyYAML",
    "Jinja2",
]

[project.scripts]
omniagents = "omniagents.cli:main"

[project.optional-dependencies]
cli = []  # CLI has no extra dependencies
flet = [
    "flet[all]==0.27.6",
]
gui = ["omniagents[flet]"]  # Alias for flet
studio = [
    "httpx>=0.27.0",
]
server = [
    "fastapi[all]>=0.115.12",
    "uvicorn>=0.34.1",
]
studio-server = [
    "fastapi[all]>=0.115.12",
    "uvicorn>=0.34.1",
]
all = ["omniagents[cli,flet,server,studio,studio-server]"]
dev = [
    "pytest",
    "pytest-asyncio",
    "bump2version",
    "black",
    "coverage[toml]",
    "pytest-cov",
    "hypothesis>=6.142.4",
    "fastapi[all]>=0.115.12",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["omniagents"]
omit = [
    "omniagents/backends/bubbletea/cmd/omni-tui/*",
    "omniagents/backends/ink/tui/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.coverage.paths]
source = [
    "omniagents",
    "*/site-packages/omniagents",
]

[tool.black]
line-length = 88
target-version = ["py311"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[project.entry-points."omniagents.backends"]
cli = "omniagents.backends.cli:CLIBackend"
flet = "omniagents.backends.flet:FletBackend"
gui = "omniagents.backends.flet:FletBackend"
server = "omniagents.backends.server:ServerBackend"
ink = "omniagents.backends.ink:InkBackend"
tui = "omniagents.backends.bubbletea:BubbleTeaBackend"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "black",
    "bump2version",
    "coverage[toml]",
    "fastapi[all]>=0.115.12",
    "hypothesis>=6.142.4",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
]

[tool.setuptools.packages.find]
include = ["omniagents*"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
# Ensure the Bubble Tea TUI Go sources and auxiliary files are included in wheels/sdists
"omniagents.backends.bubbletea" = [
    "README.md",
    "cmd/omni-tui/*.go",
    "cmd/omni-tui/go.mod",
    "cmd/omni-tui/go.sum",
    "cmd/omni-tui/themes/*",
    "vendor/*",
    "vendor/*/*",
]
# Ensure the Ink TUI TypeScript sources are included in wheels/sdists
"omniagents.backends.ink" = [
    "tui/package.json",
    "tui/tsconfig.json",
    "tui/src/**/*.ts",
    "tui/src/**/*.tsx",
    "dist/*",
]
"omniagents.studio.tracing" = [
    "static/*",
    "static/assets/*",
]
"omniagents.studio.server" = [
    "static/*",
    "static/assets/*",
]
"omniagents.core.project" = [
    "templates/*",
    "templates/**/*",
]

[tool.setuptools.dynamic]
version = {attr = "omniagents._version.__version__"}
