[project]
name = "omniagents"
dynamic = ["version"]
description = "OmniAgents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai-agents[realtime]>=0.16.0,<0.17",
    "python-dotenv",
    "pydantic-core==2.41.4",
    "pydantic==2.12.3",
    "PyYAML",
    "Jinja2",
    "requests",
    "beautifulsoup4",
    "pygit2",
    "jsonref>=1.0.0",
]

[project.scripts]
omniagents = "omniagents.cli:main"

[project.optional-dependencies]
voice = [
    "openai-agents[voice]>=0.16.0,<0.17",
]
litellm = [
    "openai-agents[litellm]>=0.16.0,<0.17",
]
studio = [
    "httpx>=0.27.0",
]
server = [
    "fastapi[all]>=0.115.12",
    "uvicorn>=0.34.1",
]
web = [
    "fastapi[all]>=0.115.12",
    "uvicorn>=0.34.1",
]
studio-server = [
    "fastapi[all]>=0.115.12",
    "uvicorn>=0.34.1",
]
docs = [
    "mkdocs-material>=9.5.0",
]
oidc = [
    "PyJWT[crypto]>=2.8.0",
]
sqlcipher = [
    "pysqlcipher3>=1.2.0",
]
session-sqlalchemy = [
    "openai-agents[sqlalchemy]>=0.16.0,<0.17",
]
session-redis = [
    "openai-agents[redis]>=0.16.0,<0.17",
]
session-mongodb = [
    "openai-agents[mongodb]>=0.16.0,<0.17",
]
session-encrypted = [
    "openai-agents[encrypt]>=0.16.0,<0.17",
]
presidio = [
    "presidio-analyzer>=2.2.0",
    "presidio-anonymizer>=2.2.0",
]
platform = [
    "PyJWT[crypto]>=2.8.0",
]
enterprise = ["omniagents[oidc,sqlcipher,presidio,platform]"]
all = ["omniagents[server,web,studio,studio-server,voice]"]
dev = [
    "pytest",
    "pytest-asyncio",
    "bump2version",
    "black",
    "coverage[toml]",
    "pytest-cov",
    "hypothesis>=6.142.4",
    "fastapi[all]>=0.115.12",
    "mkdocs-material>=9.5.0",
    "vcrpy>=5.1.0",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["omniagents"]
omit = [
    "omniagents/backends/ink/tui/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.coverage.paths]
source = [
    "omniagents",
    "*/site-packages/omniagents",
]

[tool.black]
line-length = 88
target-version = ["py311"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[project.entry-points."omniagents.providers"]
auth_platform = "omniagents.core.providers.platform.auth:PlatformAuthProvider"

[project.entry-points."omniagents.backends"]
server = "omniagents.backends.server:ServerBackend"
ink = "omniagents.backends.ink:InkBackend"
web = "omniagents.backends.web:WebBackend"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "black",
    "bump2version",
    "coverage[toml]",
    "fastapi[all]>=0.115.12",
    "hypothesis>=6.142.4",
    "mkdocs-material>=9.5.0",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "vcrpy>=5.1.0",
]

[tool.setuptools.packages.find]
include = ["omniagents*"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
# Ensure the Ink TUI TypeScript sources are included in wheels/sdists
"omniagents.backends.ink" = [
    "tui/package.json",
    "tui/tsconfig.json",
    "tui/src/**/*.ts",
    "tui/src/**/*.tsx",
    "tui/dist/*",
    "tui/dist/**/*",
]
"omniagents.backends.web" = [
    "ui/dist/*",
    "ui/dist/**/*",
]
"omniagents.studio.tracing" = [
    "static/*",
    "static/assets/*",
]
"omniagents.studio.server" = [
    "static/*",
    "static/assets/*",
]
"omniagents.core.project" = [
    "templates/*",
    "templates/**/*",
]

[tool.setuptools.dynamic]
version = {attr = "omniagents._version.__version__"}
