[project]
name = "omniagents"
version = "0.1.3"
description = "OmniAgents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flet[all]==0.27.6",
    "openai-agents==0.0.9",
    "python-dotenv",
    "pydantic-core==2.33.0",
    "pydantic==2.11.1",
    "PyYAML",
    "pytest",
]

[project.scripts]
omniagents = "omniagents.cli:main"

[project.optional-dependencies]
cli = []  # CLI has no extra dependencies
server = [
    "fastapi[all]>=0.115.12",
    "uvicorn>=0.34.1",
]
all = ["omniagents[cli,server]"]
dev = [
    "pytest",
]

[project.entry-points."omniagents.backends"]
cli = "omniagents.backends.cli:CLIBackend"
server = "omniagents.backends.server:ServerBackend"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["omniagents*"]