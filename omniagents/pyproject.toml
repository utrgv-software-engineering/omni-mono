[project]
name = "omniagents"
dynamic = ["version"]
description = "OmniAgents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai-agents==0.2.7",
    "python-dotenv",
    "pydantic-core==2.33.0",
    "pydantic==2.11.1",
    "PyYAML",
    "Jinja2",
]

[project.scripts]
omniagents = "omniagents.cli:main"

[project.optional-dependencies]
cli = []  # CLI has no extra dependencies
flet = [
    "flet[all]==0.27.6",
]
gui = ["omniagents[flet]"]  # Alias for flet
studio = [
    "httpx>=0.27.0",
]
server = [
    "fastapi[all]>=0.115.12",
    "uvicorn>=0.34.1",
]
studio-server = [
    "fastapi[all]>=0.115.12",
    "uvicorn>=0.34.1",
]
all = ["omniagents[cli,flet,server,studio,studio-server]"]
dev = [
    "pytest",
    "bump2version",
    "black",
]

[tool.black]
line-length = 88
target-version = ["py311"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[project.entry-points."omniagents.backends"]
cli = "omniagents.backends.cli:CLIBackend"
flet = "omniagents.backends.flet:FletBackend"
gui = "omniagents.backends.flet:FletBackend"
server = "omniagents.backends.server:ServerBackend"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["omniagents*"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
# Ensure the Bubble Tea TUI Go sources and auxiliary files are included in wheels/sdists
"omniagents.backends.bubbletea" = [
    "README.md",
    "cmd/omni-tui/*.go",
    "cmd/omni-tui/go.mod",
    "cmd/omni-tui/go.sum",
    "cmd/omni-tui/themes/*",
    "vendor/*",
    "vendor/*/*",
]
"omniagents.studio.tracing" = [
    "static/*",
    "static/assets/*",
]
"omniagents.studio.server" = [
    "static/*",
    "static/assets/*",
]

[tool.setuptools.dynamic]
version = {attr = "omniagents._version.__version__"}
