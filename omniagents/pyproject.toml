[project]
name = "omniagents"
version = "0.1.0"
description = "OmniAgents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flet",
    "openai-agents==0.0.9",
    "python-dotenv",
    "pydantic-core==2.33.0",
    "pydantic==2.11.1",
    "PyYAML"
]

[project.scripts]
omniagents = "omniagents.cli:main"

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.uv.workspace]
members = ["examples"]
